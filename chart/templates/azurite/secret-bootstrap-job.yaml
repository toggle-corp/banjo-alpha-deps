{{- if .Values.azurite.enabled }}
{{- /*
Static fields are computed here at RENDER time and passed via container env;
only the generated account key is resolved at runtime. The account-name,
endpoint and key-format validations run here too, so render-time misconfig
still fails closed.
*/ -}}
{{- $account := include "azurite.accountName" . -}}
{{- $endpoint := include "azurite.blobEndpoint" . -}}
{{- $protocol := ternary "https" "http" (hasPrefix "https://" (lower $endpoint)) -}}
{{- $explicitKey := .Values.azurite.account.key | default "" | toString -}}
{{- /*
Azure clients base64-decode the account key to derive the HMAC key, so a
non-base64 value fails every request with an opaque signature mismatch. Catch
it here instead.
*/ -}}
{{- if and $explicitKey (or (not (regexMatch "^[A-Za-z0-9+/]+={0,2}$" $explicitKey)) (ne (mod (len $explicitKey) 4) 0)) -}}
{{- fail "azurite.account.key must be base64 (Azure clients decode it to sign requests). Generate one with: head -c 64 /dev/urandom | base64 -w0" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-secret-bootstrap" (include "azurite.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "azurite.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
    # ArgoCD ignores helm.sh/hook-weight; it orders PreSync by sync-wave. RBAC is
    # at -5, this Job at 0, so the SA/Role/RoleBinding exist first.
    "argocd.argoproj.io/sync-wave": "0"
spec:
  backoffLimit: {{ .Values.secretBootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.secretBootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      # NOT azurite.selectorLabels: those are the Service's selector, and a pod
      # without a readiness probe counts as Ready while it runs, so the Service
      # would route blob traffic to this Job for the length of every upgrade.
      labels:
        app.kubernetes.io/name: {{ printf "%s-secret-bootstrap" (include "azurite.name" .) | trunc 63 | trimSuffix "-" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "tcpg.secretBootstrap.serviceAccountName" . }}
      restartPolicy: OnFailure
      # Matches the restricted Pod Security Standard, like the main pod does.
      # Without seccompProfile here (and capabilities.drop below) the hook Job
      # is rejected outright in a namespace enforcing `restricted`, which fails
      # the whole install at pre-install — the Secret never gets bootstrapped.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "{{ .Values.secretBootstrap.image.repository }}:{{ .Values.secretBootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.secretBootstrap.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources: {{- toYaml .Values.secretBootstrap.resources | nindent 12 }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_NAME
              value: {{ include "azurite.secretName" . | quote }}
            - name: AZ_ACCOUNT_NAME
              value: {{ $account | quote }}
            - name: AZ_BLOB_ENDPOINT
              value: {{ $endpoint | quote }}
            - name: AZ_PROTOCOL
              value: {{ $protocol | quote }}
            - name: AZ_ACCOUNT_KEY_EXPLICIT
              value: {{ $explicitKey | quote }}
            - name: HOME
              value: /tmp
            # Identity labels propagated onto the kubectl-created Secret. Label
            # and annotation VALUES must be space-free — they are word-split into
            # kubectl args at runtime. Only the two honest identity labels (name +
            # component) are stamped — see the SECRET_ANNOTATIONS comment below for
            # why instance/managed-by/chart are deliberately omitted.
            - name: SECRET_LABELS
              value: "app.kubernetes.io/name={{ include "azurite.name" . }} app.kubernetes.io/component=object-store"
            # This Secret is created out-of-band by THIS Job — it is NOT in the rendered/desired
            # manifest set. Under ArgoCD's DEFAULT label tracking (app.kubernetes.io/instance) a
            # controller would otherwise adopt it as app-owned, see it absent from desired state,
            # and AUTO-PRUNE it on the next sync. Prune=false = never delete it; IgnoreExtraneous =
            # don't even flag it OutOfSync. Both are no-ops under plain Helm/Flux.
            #
            # One `key=value` per LINE, and the script splits on newlines only, so an
            # annotation value containing spaces stays a single kubectl argument.
            # The two ArgoCD keys are merged over azurite.commonAnnotations, so a
            # same-named commonAnnotation can never replace Prune=false.
            - name: SECRET_ANNOTATIONS
              {{- $annMap := merge (dict "argocd.argoproj.io/sync-options" "Prune=false" "argocd.argoproj.io/compare-options" "IgnoreExtraneous") (deepCopy (default dict .Values.azurite.commonAnnotations)) -}}
              {{- $ann := list -}}
              {{- range $k, $v := $annMap -}}{{- $ann = append $ann (printf "%s=%s" $k (toString $v)) -}}{{- end }}
              value: {{ $ann | join "\n" | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              HOME=/tmp; export HOME

              CUR=""
              if val=$(kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" -o jsonpath='{.data.AZURE_STORAGE_ACCOUNT_KEY}' 2>/tmp/err); then
                CUR=$(printf '%s' "$val" | base64 -d 2>/dev/null || true)
              elif ! grep -qi 'notfound' /tmp/err; then
                echo "error: reading secret $SECRET_NAME failed:" >&2; cat /tmp/err >&2; exit 1
              fi

              if [ -n "${AZ_ACCOUNT_KEY_EXPLICIT:-}" ]; then
                KEY=$AZ_ACCOUNT_KEY_EXPLICIT
              elif [ -n "$CUR" ]; then
                KEY=$CUR
              else
                # 64 random bytes, base64 — the same shape as a real Azure key.
                KEY=$(head -c 64 /dev/urandom | base64 | tr -d '\n')
              fi

              CONN="DefaultEndpointsProtocol=${AZ_PROTOCOL};AccountName=${AZ_ACCOUNT_NAME};AccountKey=${KEY};BlobEndpoint=${AZ_BLOB_ENDPOINT};"

              out=$(kubectl create secret generic "$SECRET_NAME" \
                --from-literal=AZURE_STORAGE_ACCOUNT_NAME="$AZ_ACCOUNT_NAME" \
                --from-literal=AZURE_STORAGE_ACCOUNT_KEY="$KEY" \
                --from-literal=AZURE_STORAGE_BLOB_ENDPOINT="$AZ_BLOB_ENDPOINT" \
                --from-literal=AZURE_STORAGE_CONNECTION_STRING="$CONN" \
                --dry-run=client -o yaml \
                | kubectl label --local -f - --dry-run=client -o yaml $SECRET_LABELS)
              # Split SECRET_ANNOTATIONS on newlines only (values may contain
              # spaces), with globbing off so a `*` in a value stays literal.
              set -f
              IFS='
              '
              out=$(printf '%s' "$out" | kubectl annotate --local -f - --dry-run=client -o yaml $SECRET_ANNOTATIONS)
              printf '%s\n' "$out" | kubectl -n "$NAMESPACE" apply -f -
{{- end }}
