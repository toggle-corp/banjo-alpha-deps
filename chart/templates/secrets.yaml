{{- $secretName := include "tcpg.pgSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.auth.password -}}
{{- if not $password -}}
{{- if and $existing (index $existing.data "POSTGRES_PASSWORD") -}}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $database := required "auth.database is required" .Values.auth.database -}}
{{- $username := required "auth.username is required" .Values.auth.username -}}
{{- $host := printf "%s.%s.svc.cluster.local" (include "tcpg.fullname" .) .Release.Namespace -}}
{{- $port := .Values.service.port | toString -}}
{{- $uri := printf "postgres://%s:%s@%s:%s/%s" (urlquery $username) (urlquery $password) $host $port (urlquery $database) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "tcpg.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  POSTGRES_DB: {{ $database | quote }}
  POSTGRES_USER: {{ $username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_HOST: {{ $host | quote }}
  POSTGRES_PORT: {{ $port | quote }}
  POSTGRES_URI: {{ $uri | quote }}
{{- if and (ne .Values.auth.dumpAuth.type "none") .Values.auth.dumpAuth.value (not .Values.auth.existingDumpAuthSecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tcpg.loadSecretName" . }}
  labels:
    {{- include "tcpg.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  DUMP_AUTH_VALUE: {{ .Values.auth.dumpAuth.value | quote }}
{{- end }}
