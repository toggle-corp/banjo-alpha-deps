{{- $secretName := include "toggle-postgres.secretname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.auth.password -}}
{{- if not $password -}}
{{- if and $existing (index $existing.data "POSTGRES_PASSWORD") -}}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "toggle-postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ required "auth.database is required" .Values.auth.database | quote }}
  POSTGRES_USER: {{ required "auth.username is required" .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DUMP_URL: {{ .Values.auth.dumpUrl | default "" | quote }}
