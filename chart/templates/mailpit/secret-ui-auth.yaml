{{- if and .Values.mailpit.enabled .Values.mailpit.ui.auth.htpasswd }}
{{/*
Mailpit's `MP_UI_AUTH_FILE`: one `user:bcrypt-hash` line per user. The hash is
supplied by the operator, not computed here — sprig's `htpasswd` salts randomly,
so a chart-computed hash would differ on every render and leave an ArgoCD app
permanently OutOfSync. Generate one with:

  htpasswd -nbB <user> '<password>'
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailpit.authSecretName" . }}
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
  {{- with .Values.mailpit.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ include "mailpit.authFileKey" . }}: |
    {{- .Values.mailpit.ui.auth.htpasswd | nindent 4 }}
{{- end }}
