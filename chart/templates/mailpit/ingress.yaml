{{- if and .Values.mailpit.enabled .Values.mailpit.ui.ingress.enabled }}
{{- $ing := .Values.mailpit.ui.ingress }}
{{- if not $ing.hostname }}
{{- fail "mailpit.ui.ingress.hostname is required when mailpit.ui.ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "mailpit.fullname" . }}
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
  {{- $annotations := merge (deepCopy (default dict $ing.annotations)) (default dict .Values.mailpit.commonAnnotations) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $ing.hostname | quote }}
      http:
        paths:
          - path: {{ $ing.path }}
            pathType: {{ $ing.pathType }}
            backend:
              service:
                name: {{ template "mailpit.fullname" . }}
                port:
                  number: {{ .Values.mailpit.service.httpPort }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
