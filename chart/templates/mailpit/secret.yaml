{{- if .Values.mailpit.enabled }}
{{/*
Consumer-facing SMTP settings. A Secret rather than a ConfigMap purely so apps
bind every dependency the same way (`envFrom: secretRef`) — with
`smtp.acceptAnyAuth` on, Mailpit takes any credentials and also none, so nothing
here is actually confidential. Rendered straight from values: there is no
credential to generate, so this needs none of the bootstrap-Job machinery the
Postgres/MinIO Secrets use.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailpit.smtpSecretName" . }}
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
  {{- with .Values.mailpit.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  SMTP_HOST: {{ include "mailpit.smtpHost" . | quote }}
  SMTP_PORT: {{ .Values.mailpit.service.smtpPort | quote }}
  # Mailpit accepts any AUTH exchange (and also none) while
  # `smtp.acceptAnyAuth` is on. Empty strings keep the keys present so a client
  # that always reads them gets "no credentials" rather than a missing-variable
  # error.
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_USE_TLS: "false"
  SMTP_URL: {{ printf "smtp://%s:%v" (include "mailpit.smtpHost" .) .Values.mailpit.service.smtpPort | quote }}
{{- end }}
