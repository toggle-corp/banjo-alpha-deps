{{- if .Values.mailpit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "mailpit.fullname" . }}
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
  {{- with .Values.mailpit.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mailpit.service.type }}
  ports:
    - port: {{ .Values.mailpit.service.smtpPort }}
      targetPort: smtp
      protocol: TCP
      name: smtp
    - port: {{ .Values.mailpit.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mailpit.selectorLabels" . | nindent 4 }}
{{- end }}
