{{- if or .Values.tcpg.enabled .Values.minio.enabled }}
{{- /*
Shared RBAC for the credential-bootstrap Helm-hook Jobs (tcpg + minio). Runs at
hook weight -5 so the SA/Role/RoleBinding exist before the Jobs (weight 0). The
Role can `create` secrets (create cannot be resourceName-scoped) and
get/update/patch only the named credential Secrets of the enabled components.
*/ -}}
{{- $sa := include "tcpg.secretBootstrap.serviceAccountName" . -}}
{{- $names := list -}}
{{- if .Values.tcpg.enabled -}}
{{- $names = append $names (include "tcpg.pgSecretName" .) -}}
{{- end -}}
{{- if .Values.minio.enabled -}}
{{- $names = append $names .Values.minio.auth.existingSecret -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    app.kubernetes.io/name: secret-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  labels:
    app.kubernetes.io/name: secret-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # `create` cannot be scoped by resourceNames — needed for the first bootstrap.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Reading / updating the existing credential Secrets is scoped to their names.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames:
      {{- range $names }}
      - {{ . | quote }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  labels:
    app.kubernetes.io/name: secret-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
