{{- if .Values.minio.enabled }}
{{- /*
Static fields are computed here at RENDER time and passed via container env;
only the generated credential is resolved at runtime. The endpoint derivation
and its fail-closed validations stay in this template (moved verbatim from the
old secret.yaml) so render-time misconfig still fails closed.
*/ -}}
{{- $secretName := .Values.minio.auth.existingSecret -}}
{{- $accessKeyId := required "minioConfig.accessKeyId required" .Values.minioConfig.accessKeyId -}}
{{- $region := .Values.minioConfig.region -}}
{{- $endpoint := .Values.minioConfig.endpointUrl -}}
{{- if not $endpoint -}}
{{- if not (and .Values.minio.ingress.enabled .Values.minio.ingress.hostname (ne .Values.minio.ingress.hostname "minio.local")) -}}
{{- fail "minioConfig.endpointUrl is empty: set minio.ingress.hostname to your S3 API host (and enable minio.ingress), or set minioConfig.endpointUrl explicitly" -}}
{{- end -}}
{{- $endpoint = printf "%s://%s" .Values.minioConfig.endpointScheme .Values.minio.ingress.hostname -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-secret-bootstrap
  labels:
    {{- include "minio.s3.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.secretBootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.secretBootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "minio.s3.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tcpg.secretBootstrap.serviceAccountName" . }}
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      containers:
        - name: bootstrap
          image: "{{ .Values.secretBootstrap.image.repository }}:{{ .Values.secretBootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.secretBootstrap.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_NAME
              value: {{ $secretName | quote }}
            - name: S3_ENDPOINT_URL
              value: {{ $endpoint | quote }}
            - name: S3_REGION
              value: {{ $region | quote }}
            - name: S3_ACCESS_KEY_ID
              value: {{ $accessKeyId | quote }}
            - name: S3_SECRET_ACCESS_KEY_EXPLICIT
              value: {{ .Values.minioConfig.secretAccessKey | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -n "${S3_SECRET_ACCESS_KEY_EXPLICIT:-}" ]; then
                SECRET_KEY="$S3_SECRET_ACCESS_KEY_EXPLICIT"
              elif kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" >/dev/null 2>&1; then
                echo "secret $SECRET_NAME already exists; preserving"; exit 0
              else
                SECRET_KEY="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)"
              fi
              kubectl -n "$NAMESPACE" create secret generic "$SECRET_NAME" \
                --from-literal=S3_ENDPOINT_URL="$S3_ENDPOINT_URL" \
                --from-literal=S3_REGION="$S3_REGION" \
                --from-literal=S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
                --from-literal=S3_SECRET_ACCESS_KEY="$SECRET_KEY" \
                --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -
{{- end }}
