{{- if .Values.minio.enabled }}
{{- /*
Static fields are computed here at RENDER time and passed via container env;
only the generated credential is resolved at runtime. The endpoint derivation
and its fail-closed validations stay in this template (moved verbatim from the
old secret.yaml) so render-time misconfig still fails closed.
*/ -}}
{{- $secretName := .Values.minio.auth.existingSecret -}}
{{- $accessKeyId := required "minioConfig.accessKeyId required" .Values.minioConfig.accessKeyId -}}
{{- $region := .Values.minioConfig.region -}}
{{- $endpoint := .Values.minioConfig.endpointUrl -}}
{{- if not $endpoint -}}
{{- if not (and .Values.minio.ingress.enabled .Values.minio.ingress.hostname (ne .Values.minio.ingress.hostname "minio.local")) -}}
{{- fail "minioConfig.endpointUrl is empty: set minio.ingress.hostname to your S3 API host (and enable minio.ingress), or set minioConfig.endpointUrl explicitly" -}}
{{- end -}}
{{- $endpoint = printf "%s://%s" .Values.minioConfig.endpointScheme .Values.minio.ingress.hostname -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-secret-bootstrap
  labels:
    {{- include "minio.s3.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
    # ArgoCD ignores helm.sh/hook-weight; it orders PreSync by sync-wave. RBAC is
    # at -5, this Job at 0, so the SA/Role/RoleBinding exist first.
    "argocd.argoproj.io/sync-wave": "0"
spec:
  backoffLimit: {{ .Values.secretBootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.secretBootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "minio.s3.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tcpg.secretBootstrap.serviceAccountName" . }}
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: bootstrap
          image: "{{ .Values.secretBootstrap.image.repository }}:{{ .Values.secretBootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.secretBootstrap.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          resources: {{- toYaml .Values.secretBootstrap.resources | nindent 12 }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_NAME
              value: {{ $secretName | quote }}
            - name: S3_ENDPOINT_URL
              value: {{ $endpoint | quote }}
            - name: S3_REGION
              value: {{ $region | quote }}
            - name: S3_ACCESS_KEY_ID
              value: {{ $accessKeyId | quote }}
            - name: S3_SECRET_ACCESS_KEY_EXPLICIT
              value: {{ .Values.minioConfig.secretAccessKey | quote }}
            - name: HOME
              value: /tmp
            # Identity labels propagated onto the kubectl-created Secret. Label
            # and annotation VALUES must be space-free — they are word-split into
            # kubectl args at runtime. Only the two honest identity labels (name +
            # component) are stamped — see the SECRET_ANNOTATIONS comment below for
            # why instance/managed-by/chart are deliberately omitted. MinIO has no
            # commonAnnotations, so SECRET_ANNOTATIONS is just the two argo opts.
            - name: SECRET_LABELS
              value: "app.kubernetes.io/name=minio app.kubernetes.io/component=object-store"
            # This Secret is created out-of-band by THIS Job — it is NOT in the rendered/desired
            # manifest set. Under ArgoCD's DEFAULT label tracking (app.kubernetes.io/instance) a
            # controller would otherwise adopt it as app-owned, see it absent from desired state,
            # and AUTO-PRUNE it on the next sync (the cause of the "fine on deploy, gone hours
            # later" outage). Prune=false = never delete it; IgnoreExtraneous = don't even flag it
            # OutOfSync. Both are no-ops under plain Helm/Flux. We also drop the
            # instance/managed-by/chart labels from SECRET_LABELS so a default-config controller
            # never adopts it in the first place — these annotations are the durable belt-and-suspenders.
            - name: SECRET_ANNOTATIONS
              value: "argocd.argoproj.io/sync-options=Prune=false argocd.argoproj.io/compare-options=IgnoreExtraneous"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              HOME=/tmp; export HOME

              CUR=""
              if val=$(kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" -o jsonpath='{.data.S3_SECRET_ACCESS_KEY}' 2>/tmp/err); then
                CUR=$(printf '%s' "$val" | base64 -d 2>/dev/null || true)
              elif ! grep -qi 'notfound' /tmp/err; then
                echo "error: reading secret $SECRET_NAME failed:" >&2; cat /tmp/err >&2; exit 1
              fi

              if [ -n "${S3_SECRET_ACCESS_KEY_EXPLICIT:-}" ]; then
                SECRET_KEY=$S3_SECRET_ACCESS_KEY_EXPLICIT
              elif [ -n "$CUR" ]; then
                SECRET_KEY=$CUR
              else
                SECRET_KEY=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)
              fi

              out=$(kubectl create secret generic "$SECRET_NAME" \
                --from-literal=S3_ENDPOINT_URL="$S3_ENDPOINT_URL" \
                --from-literal=S3_REGION="$S3_REGION" \
                --from-literal=S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
                --from-literal=S3_SECRET_ACCESS_KEY="$SECRET_KEY" \
                --dry-run=client -o yaml \
                | kubectl label --local -f - --dry-run=client -o yaml $SECRET_LABELS)
              if [ -n "${SECRET_ANNOTATIONS:-}" ]; then
                out=$(printf '%s' "$out" | kubectl annotate --local -f - --dry-run=client -o yaml $SECRET_ANNOTATIONS)
              fi
              printf '%s\n' "$out" | kubectl -n "$NAMESPACE" apply -f -
{{- end }}
