{{- if .Values.mailhog.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "mailhog.fullname" . }}
  labels:
    {{- include "mailhog.labels" . | nindent 4 }}
  {{- with .Values.mailhog.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mailhog.service.type }}
  ports:
    - port: {{ .Values.mailhog.service.smtpPort }}
      targetPort: smtp
      protocol: TCP
      name: smtp
    - port: {{ .Values.mailhog.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mailhog.selectorLabels" . | nindent 4 }}
{{- end }}
