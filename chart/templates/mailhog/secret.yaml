{{- if .Values.mailhog.enabled }}
{{/*
Consumer-facing SMTP settings. A Secret rather than a ConfigMap purely so apps
bind every dependency the same way (`envFrom: secretRef`) — MailHog accepts any
SMTP credentials and rejects none, so nothing here is actually confidential.
Rendered straight from values: there is no credential to generate, so this needs
none of the bootstrap-Job machinery the Postgres/MinIO Secrets use.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailhog.smtpSecretName" . }}
  labels:
    {{- include "mailhog.labels" . | nindent 4 }}
  {{- with .Values.mailhog.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  SMTP_HOST: {{ include "mailhog.smtpHost" . | quote }}
  SMTP_PORT: {{ .Values.mailhog.service.smtpPort | quote }}
  # MailHog accepts any AUTH exchange and also accepts none. Empty strings keep
  # the keys present so a client that always reads them gets "no credentials"
  # rather than a missing-variable error.
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_USE_TLS: "false"
  SMTP_URL: {{ printf "smtp://%s:%v" (include "mailhog.smtpHost" .) .Values.mailhog.service.smtpPort | quote }}
{{- end }}
