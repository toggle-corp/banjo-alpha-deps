{{- if and .Values.mailhog.enabled .Values.mailhog.ui.auth.htpasswd }}
{{/*
MailHog's `MH_AUTH_FILE`: one `user:bcrypt-hash` line per user. The hash is
supplied by the operator, not computed here — sprig's `htpasswd` salts randomly,
so a chart-computed hash would differ on every render and leave an ArgoCD app
permanently OutOfSync. Generate one with:

  docker run --rm mailhog/mailhog:v1.0.1 bcrypt '<password>'
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailhog.authSecretName" . }}
  labels:
    {{- include "mailhog.labels" . | nindent 4 }}
  {{- with .Values.mailhog.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ include "mailhog.authFileKey" . }}: |
    {{- .Values.mailhog.ui.auth.htpasswd | nindent 4 }}
{{- end }}
