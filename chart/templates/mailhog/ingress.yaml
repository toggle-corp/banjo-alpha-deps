{{- if and .Values.mailhog.enabled .Values.mailhog.ui.ingress.enabled }}
{{- $ing := .Values.mailhog.ui.ingress }}
{{- if not $ing.hostname }}
{{- fail "mailhog.ui.ingress.hostname is required when mailhog.ui.ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "mailhog.fullname" . }}
  labels:
    {{- include "mailhog.labels" . | nindent 4 }}
  {{- $annotations := merge (deepCopy (default dict $ing.annotations)) (default dict .Values.mailhog.commonAnnotations) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $ing.hostname | quote }}
      http:
        paths:
          - path: {{ $ing.path }}
            pathType: {{ $ing.pathType }}
            backend:
              service:
                name: {{ template "mailhog.fullname" . }}
                port:
                  number: {{ .Values.mailhog.service.httpPort }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
