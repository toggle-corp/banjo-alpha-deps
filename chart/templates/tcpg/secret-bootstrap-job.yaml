{{- if .Values.tcpg.enabled }}
{{- /*
Static fields are computed here at RENDER time and passed via container env;
only the generated credential is resolved at runtime. The required/fail
validations stay in this template so render-time misconfig still fails closed.
*/ -}}
{{- $database := required "tcpg.init.database is required" .Values.tcpg.init.database -}}
{{- $username := required "tcpg.init.username is required" .Values.tcpg.init.username -}}
{{- $host := printf "%s.%s.svc.cluster.local" (include "tcpg.fullname" .) .Release.Namespace -}}
{{- $port := .Values.tcpg.service.port | toString -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tcpg.fullname" . }}-secret-bootstrap
  labels:
    {{- include "tcpg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
    # ArgoCD ignores helm.sh/hook-weight; it orders PreSync by sync-wave. RBAC is
    # at -5, this Job at 0, so the SA/Role/RoleBinding exist first.
    "argocd.argoproj.io/sync-wave": "0"
spec:
  backoffLimit: {{ .Values.secretBootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.secretBootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "tcpg.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tcpg.secretBootstrap.serviceAccountName" . }}
      restartPolicy: OnFailure
      # Matches the restricted Pod Security Standard, like the main pod does.
      # Without seccompProfile here (and capabilities.drop below) the hook Job
      # is rejected outright in a namespace enforcing `restricted`, which fails
      # the whole install at pre-install — the Secret never gets bootstrapped.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "{{ .Values.secretBootstrap.image.repository }}:{{ .Values.secretBootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.secretBootstrap.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources: {{- toYaml .Values.secretBootstrap.resources | nindent 12 }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_NAME
              value: {{ include "tcpg.pgSecretName" . | quote }}
            - name: PG_DB
              value: {{ $database | quote }}
            - name: PG_USER
              value: {{ $username | quote }}
            - name: PG_HOST
              value: {{ $host | quote }}
            - name: PG_PORT
              value: {{ $port | quote }}
            - name: PG_DB_ENC
              value: {{ urlquery $database | quote }}
            - name: PG_USER_ENC
              value: {{ urlquery $username | quote }}
            - name: PG_PASSWORD_EXPLICIT
              value: {{ .Values.tcpg.init.password | quote }}
            - name: PG_PASSWORD_EXPLICIT_ENC
              value: {{ urlquery .Values.tcpg.init.password | quote }}
            - name: HOME
              value: /tmp
            # Identity labels propagated onto the kubectl-created Secret. Label
            # and annotation VALUES must be space-free — they are word-split into
            # kubectl args at runtime. Only the two honest identity labels (name +
            # component) are stamped — see the SECRET_ANNOTATIONS comment below for
            # why instance/managed-by/chart are deliberately omitted.
            - name: SECRET_LABELS
              value: "app.kubernetes.io/name={{ include "tcpg.name" . }} app.kubernetes.io/component=database"
            # This Secret is created out-of-band by THIS Job — it is NOT in the rendered/desired
            # manifest set. Under ArgoCD's DEFAULT label tracking (app.kubernetes.io/instance) a
            # controller would otherwise adopt it as app-owned, see it absent from desired state,
            # and AUTO-PRUNE it on the next sync (the cause of the "fine on deploy, gone hours
            # later" outage). Prune=false = never delete it; IgnoreExtraneous = don't even flag it
            # OutOfSync. Both are no-ops under plain Helm/Flux. We also drop the
            # instance/managed-by/chart labels from SECRET_LABELS so a default-config controller
            # never adopts it in the first place — these annotations are the durable belt-and-suspenders.
            - name: SECRET_ANNOTATIONS
              {{- $ann := list "argocd.argoproj.io/sync-options=Prune=false" "argocd.argoproj.io/compare-options=IgnoreExtraneous" -}}
              {{- range $k, $v := .Values.tcpg.commonAnnotations -}}{{- $ann = append $ann (printf "%s=%s" $k (toString $v)) -}}{{- end }}
              value: {{ $ann | join " " | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              HOME=/tmp; export HOME

              urlenc() {  # RFC3986 unreserved kept; everything else %XX (busybox-ash safe)
                s=$1; o=
                while [ -n "$s" ]; do
                  c=${s%"${s#?}"}; s=${s#?}
                  case "$c" in
                    [a-zA-Z0-9.~_-]) o="$o$c" ;;
                    *) o="$o$(printf '%%%02X' "'$c")" ;;
                  esac
                done
                printf '%s' "$o"
              }

              CUR=""
              if val=$(kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" -o jsonpath='{.data.POSTGRES_PASSWORD}' 2>/tmp/err); then
                CUR=$(printf '%s' "$val" | base64 -d 2>/dev/null || true)
              elif ! grep -qi 'notfound' /tmp/err; then
                echo "error: reading secret $SECRET_NAME failed:" >&2; cat /tmp/err >&2; exit 1
              fi

              if [ -n "${PG_PASSWORD_EXPLICIT:-}" ]; then
                RAW=$PG_PASSWORD_EXPLICIT; ENC=$PG_PASSWORD_EXPLICIT_ENC
              elif [ -n "$CUR" ]; then
                RAW=$CUR; ENC=$(urlenc "$CUR")
              else
                RAW=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32); ENC=$RAW
              fi

              URI="postgres://${PG_USER_ENC}:${ENC}@${PG_HOST}:${PG_PORT}/${PG_DB_ENC}"

              out=$(kubectl create secret generic "$SECRET_NAME" \
                --from-literal=POSTGRES_DB="$PG_DB" \
                --from-literal=POSTGRES_USER="$PG_USER" \
                --from-literal=POSTGRES_PASSWORD="$RAW" \
                --from-literal=POSTGRES_HOST="$PG_HOST" \
                --from-literal=POSTGRES_PORT="$PG_PORT" \
                --from-literal=POSTGRES_URI="$URI" \
                --dry-run=client -o yaml \
                | kubectl label --local -f - --dry-run=client -o yaml $SECRET_LABELS)
              if [ -n "${SECRET_ANNOTATIONS:-}" ]; then
                out=$(printf '%s' "$out" | kubectl annotate --local -f - --dry-run=client -o yaml $SECRET_ANNOTATIONS)
              fi
              printf '%s\n' "$out" | kubectl -n "$NAMESPACE" apply -f -
{{- end }}
