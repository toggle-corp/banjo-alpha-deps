{{- if .Values.tcpg.enabled }}
{{- /*
Static fields are computed here at RENDER time and passed via container env;
only the generated credential is resolved at runtime. The required/fail
validations stay in this template so render-time misconfig still fails closed.
*/ -}}
{{- $database := required "tcpg.init.database is required" .Values.tcpg.init.database -}}
{{- $username := required "tcpg.init.username is required" .Values.tcpg.init.username -}}
{{- $host := printf "%s.%s.svc.cluster.local" (include "tcpg.fullname" .) .Release.Namespace -}}
{{- $port := .Values.tcpg.service.port | toString -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tcpg.fullname" . }}-secret-bootstrap
  labels:
    {{- include "tcpg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.secretBootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.secretBootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "tcpg.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tcpg.secretBootstrap.serviceAccountName" . }}
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      containers:
        - name: bootstrap
          image: "{{ .Values.secretBootstrap.image.repository }}:{{ .Values.secretBootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.secretBootstrap.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_NAME
              value: {{ include "tcpg.pgSecretName" . | quote }}
            - name: PG_DB
              value: {{ $database | quote }}
            - name: PG_USER
              value: {{ $username | quote }}
            - name: PG_HOST
              value: {{ $host | quote }}
            - name: PG_PORT
              value: {{ $port | quote }}
            - name: PG_DB_ENC
              value: {{ urlquery $database | quote }}
            - name: PG_USER_ENC
              value: {{ urlquery $username | quote }}
            - name: PG_PASSWORD_EXPLICIT
              value: {{ .Values.tcpg.init.password | quote }}
            - name: PG_PASSWORD_EXPLICIT_ENC
              value: {{ urlquery .Values.tcpg.init.password | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -n "${PG_PASSWORD_EXPLICIT:-}" ]; then
                RAW="$PG_PASSWORD_EXPLICIT"; ENC="$PG_PASSWORD_EXPLICIT_ENC"
              elif kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" >/dev/null 2>&1; then
                echo "secret $SECRET_NAME already exists; preserving"; exit 0
              else
                RAW="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)"; ENC="$RAW"
              fi
              URI="postgres://${PG_USER_ENC}:${ENC}@${PG_HOST}:${PG_PORT}/${PG_DB_ENC}"
              kubectl -n "$NAMESPACE" create secret generic "$SECRET_NAME" \
                --from-literal=POSTGRES_DB="$PG_DB" \
                --from-literal=POSTGRES_USER="$PG_USER" \
                --from-literal=POSTGRES_PASSWORD="$RAW" \
                --from-literal=POSTGRES_HOST="$PG_HOST" \
                --from-literal=POSTGRES_PORT="$PG_PORT" \
                --from-literal=POSTGRES_URI="$URI" \
                --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -
{{- end }}
