{{- if .Values.tcpg.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "tcpg.fullname" . }}
  labels:
    {{- include "tcpg.labels" . | nindent 4 }}
  {{- with .Values.tcpg.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ template "tcpg.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tcpg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tcpg.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/tcpg/secrets.yaml") . | sha256sum }}
        {{- if .Values.tcpg.init.restore.enabled }}
        checksum/restore-script: {{ include (print $.Template.BasePath "/tcpg/configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.tcpg.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.tcpg.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.tcpg.podSecurityContext | nindent 8 }}
      {{- if .Values.tcpg.init.restore.enabled }}
      {{- if not .Values.tcpg.init.restore.path -}}
      {{- fail "tcpg.init.restore.path is required when tcpg.init.restore.enabled is true" -}}
      {{- end }}
      {{- if not .Values.tcpg.init.restore.baseUrl -}}
      {{- fail "tcpg.init.restore.baseUrl is required when tcpg.init.restore.enabled is true" -}}
      {{- end }}
      {{- if not (has .Values.tcpg.init.restore.auth.type (list "none" "basic" "bearer")) -}}
      {{- fail "tcpg.init.restore.auth.type must be one of: none, basic, bearer" -}}
      {{- end }}
      {{- if eq .Values.tcpg.init.restore.auth.type "none" }}
      {{- if .Values.tcpg.init.restore.auth.existingSecret.name -}}
      {{- fail "tcpg.init.restore.auth.existingSecret.name is set but tcpg.init.restore.auth.type is 'none'; set type to basic/bearer or clear existingSecret.name" -}}
      {{- end }}
      {{- else }}
      {{- if and .Values.tcpg.init.restore.auth.value .Values.tcpg.init.restore.auth.existingSecret.name -}}
      {{- fail "Set either tcpg.init.restore.auth.value (inline) or tcpg.init.restore.auth.existingSecret.name (external), not both" -}}
      {{- end }}
      {{- if and (not .Values.tcpg.init.restore.auth.value) (not .Values.tcpg.init.restore.auth.existingSecret.name) -}}
      {{- fail "tcpg.init.restore.auth.type is basic/bearer but no value source is configured; provide tcpg.init.restore.auth.value or tcpg.init.restore.auth.existingSecret.name" -}}
      {{- end }}
      {{- if and .Values.tcpg.init.restore.auth.existingSecret.name (not .Values.tcpg.init.restore.auth.existingSecret.key) -}}
      {{- fail "tcpg.init.restore.auth.existingSecret.key is required when existingSecret.name is set" -}}
      {{- end }}
      {{- end }}
      {{- $baseHasSlash := hasSuffix "/" .Values.tcpg.init.restore.baseUrl -}}
      {{- $pathHasSlash := hasPrefix "/" .Values.tcpg.init.restore.path -}}
      {{- if and $baseHasSlash $pathHasSlash -}}
      {{- fail "tcpg.init.restore.baseUrl ends with '/' and tcpg.init.restore.path starts with '/' — would produce '//' in URL; remove one" -}}
      {{- end }}
      {{- if and (not $baseHasSlash) (not $pathHasSlash) -}}
      {{- fail "tcpg.init.restore.baseUrl and tcpg.init.restore.path have no slash between them; add trailing '/' to restore.baseUrl or leading '/' to restore.path" -}}
      {{- end }}
      initContainers:
        - name: download-dump
          image: "{{ .Values.tcpg.initImage.repository }}:{{ .Values.tcpg.initImage.tag }}"
          imagePullPolicy: {{ .Values.tcpg.initImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.tcpg.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -eu
              LOCAL_RESTORE_PATH="/restore/dump"
              if [ -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
                echo "PGDATA already initialized; skipping dump download."
                exit 0
              fi
              FULL_URL="${RESTORE_BASE_URL}${RESTORE_PATH}"
              echo "Downloading dump from $FULL_URL... -> $LOCAL_RESTORE_PATH"
              curl_download() {
                if [ "$RESTORE_INSECURE_SKIP_TLS_VERIFY" = "true" ]; then
                  curl -k -D - -fsSL --retry 3 --retry-delay 5 "$@"
                else
                  curl -D - -fsSL --retry 3 --retry-delay 5 "$@"
                fi
              }
              if [ "$RESTORE_INSECURE_SKIP_TLS_VERIFY" = "true" ]; then
                echo "WARNING: TLS certificate verification is disabled (-k)"
              fi
              case "$RESTORE_AUTH_TYPE" in
                basic)
                  curl_download -u "$RESTORE_AUTH_VALUE" -o "$LOCAL_RESTORE_PATH" "$FULL_URL"
                  ;;
                bearer)
                  curl_download -H "Authorization: Bearer $RESTORE_AUTH_VALUE" -o "$LOCAL_RESTORE_PATH" "$FULL_URL"
                  ;;
                none)
                  curl_download -o "$LOCAL_RESTORE_PATH" "$FULL_URL"
                  ;;
                *)
                  echo "Unknown RESTORE_AUTH_TYPE: $RESTORE_AUTH_TYPE (expected none, basic, bearer)" >&2
                  exit 1
                  ;;
              esac
              du -sh "$LOCAL_RESTORE_PATH"
          env:
            - name: RESTORE_BASE_URL
              value: {{ .Values.tcpg.init.restore.baseUrl | quote }}
            - name: RESTORE_PATH
              value: {{ .Values.tcpg.init.restore.path | quote }}
            - name: RESTORE_AUTH_TYPE
              value: {{ .Values.tcpg.init.restore.auth.type | quote }}
            - name: RESTORE_INSECURE_SKIP_TLS_VERIFY
              value: {{ .Values.tcpg.init.restore.insecureSkipTlsVerify | quote }}
            {{- if ne .Values.tcpg.init.restore.auth.type "none" }}
            - name: RESTORE_AUTH_VALUE
              valueFrom:
                secretKeyRef:
                  {{- if .Values.tcpg.init.restore.auth.existingSecret.name }}
                  name: {{ .Values.tcpg.init.restore.auth.existingSecret.name | quote }}
                  key: {{ .Values.tcpg.init.restore.auth.existingSecret.key | quote }}
                  {{- else }}
                  name: {{ include "tcpg.restoreSecretName" . }}
                  key: RESTORE_AUTH_VALUE
                  {{- end }}
            {{- end }}
          volumeMounts:
            - name: restore
              mountPath: /restore
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: pg
          image: "{{ .Values.tcpg.image.repository }}:{{ .Values.tcpg.image.tag }}"
          imagePullPolicy: {{ .Values.tcpg.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.tcpg.containerSecurityContext | nindent 12 }}
          {{- if .Values.tcpg.init.restore.enabled }}
          command:
            - /bin/sh
            - /etc/postgres-wrapper/entrypoint-wrapper.sh
          {{- end }}
          {{- /*
          Parameters are passed as `-c key=value` args. When restore is enabled
          they follow the wrapper; otherwise the image entrypoint receives
          `postgres -c ...` directly. Map iteration is key-sorted, so the arg
          list is deterministic across renders.
          */}}
          {{- $params := include "tcpg.parameters" . | fromYaml }}
          args:
            - postgres
            {{- range $k, $v := $params }}
            - -c
            - {{ printf "%s=%s" $k ($v | toString) | quote }}
            {{- end }}
          # Defence in depth, not a fix for a live bug: containerd honours the
          # image's `STOPSIGNAL SIGINT`, so Postgres already fast-shuts-down
          # cleanly here. This makes that explicit and independent of the image
          # — a Postgres image built without STOPSIGNAL would otherwise get
          # SIGTERM, read it as a *smart* shutdown, wait for clients, and be
          # SIGKILLed into a crash-recovering data directory. See values.yaml.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - exec pg_ctl -D "$PGDATA" -m fast -w -t {{ max 10 (sub .Values.tcpg.terminationGracePeriodSeconds 20) }} stop
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- if .Values.tcpg.init.restore.enabled }}
            - name: PG_PVC_NAME
              value: {{ template "tcpg.fullname" . }}-pg-data
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ template "tcpg.pgSecretName" . }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            # Restore can take a while; allow up to 30 min on first start.
            failureThreshold: 180
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.tcpg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run-postgresql
              mountPath: /var/run/postgresql
            {{- if .Values.tcpg.shm.enabled }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
            {{- if .Values.tcpg.init.restore.enabled }}
            # /restore is RW: 10-restore.sh deletes the dump after a successful restore to free the emptyDir.
            - name: restore
              mountPath: /restore
            - name: restore-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: entrypoint-wrapper
              mountPath: /etc/postgres-wrapper
              readOnly: true
            {{- end }}
      {{- with .Values.tcpg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tcpg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tcpg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: pg-data
          {{- if .Values.tcpg.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ template "tcpg.fullname" . }}-pg-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: run-postgresql
          emptyDir: {}
        {{- if .Values.tcpg.shm.enabled }}
        # Parallel workers build hash tables here; the 64Mi Kubernetes default
        # makes such queries fail outright rather than run slowly.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tcpg.shm.size }}
        {{- end }}
        {{- if .Values.tcpg.init.restore.enabled }}
        - name: restore
          emptyDir: {}
        - name: restore-script
          configMap:
            name: {{ template "tcpg.fullname" . }}-restore
            defaultMode: 0755
            items:
              - key: 10-restore.sh
                path: 10-restore.sh
        - name: entrypoint-wrapper
          configMap:
            name: {{ template "tcpg.fullname" . }}-restore
            defaultMode: 0755
            items:
              - key: entrypoint-wrapper.sh
                path: entrypoint-wrapper.sh
        {{- end }}
{{- end }}
