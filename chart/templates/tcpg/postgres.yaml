{{- if .Values.tcpg.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "tcpg.fullname" . }}
  labels:
    {{- include "tcpg.labels" . | nindent 4 }}
  {{- with .Values.tcpg.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ template "tcpg.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tcpg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tcpg.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/tcpg/secrets.yaml") . | sha256sum }}
        {{- if .Values.tcpg.auth.dumpPath }}
        checksum/restore-script: {{ include (print $.Template.BasePath "/tcpg/configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.tcpg.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.tcpg.podSecurityContext | nindent 8 }}
      {{- if .Values.tcpg.auth.dumpPath }}
      {{- if not .Values.tcpg.auth.dumpBaseUrl -}}
      {{- fail "tcpg.auth.dumpBaseUrl is required when tcpg.auth.dumpPath is set" -}}
      {{- end }}
      {{- if not (has .Values.tcpg.auth.dumpAuth.type (list "none" "basic" "bearer")) -}}
      {{- fail "tcpg.auth.dumpAuth.type must be one of: none, basic, bearer" -}}
      {{- end }}
      {{- if eq .Values.tcpg.auth.dumpAuth.type "none" }}
      {{- if .Values.tcpg.auth.existingDumpAuthSecret.name -}}
      {{- fail "tcpg.auth.existingDumpAuthSecret.name is set but tcpg.auth.dumpAuth.type is 'none'; set type to basic/bearer or clear existingDumpAuthSecret.name" -}}
      {{- end }}
      {{- else }}
      {{- if and .Values.tcpg.auth.dumpAuth.value .Values.tcpg.auth.existingDumpAuthSecret.name -}}
      {{- fail "Set either tcpg.auth.dumpAuth.value (inline) or tcpg.auth.existingDumpAuthSecret.name (external), not both" -}}
      {{- end }}
      {{- if and (not .Values.tcpg.auth.dumpAuth.value) (not .Values.tcpg.auth.existingDumpAuthSecret.name) -}}
      {{- fail "tcpg.auth.dumpAuth.type is basic/bearer but no value source is configured; provide tcpg.auth.dumpAuth.value or tcpg.auth.existingDumpAuthSecret.name" -}}
      {{- end }}
      {{- end }}
      {{- $baseHasSlash := hasSuffix "/" .Values.tcpg.auth.dumpBaseUrl -}}
      {{- $pathHasSlash := hasPrefix "/" .Values.tcpg.auth.dumpPath -}}
      {{- if and $baseHasSlash $pathHasSlash -}}
      {{- fail "tcpg.auth.dumpBaseUrl ends with '/' and tcpg.auth.dumpPath starts with '/' — would produce '//' in URL; remove one" -}}
      {{- end }}
      {{- if and (not $baseHasSlash) (not $pathHasSlash) -}}
      {{- fail "tcpg.auth.dumpBaseUrl and tcpg.auth.dumpPath have no slash between them; add trailing '/' to dumpBaseUrl or leading '/' to dumpPath" -}}
      {{- end }}
      initContainers:
        - name: download-dump
          image: "{{ .Values.tcpg.initImage.repository }}:{{ .Values.tcpg.initImage.tag }}"
          imagePullPolicy: {{ .Values.tcpg.initImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.tcpg.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -eu
              LOCAL_DUMP_PATH="/dump/dump"
              if [ -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
                echo "PGDATA already initialized; skipping dump download."
                exit 0
              fi
              FULL_URL="${DUMP_BASE_URL}${DUMP_PATH}"
              echo "Downloading dump from $FULL_URL... -> $LOCAL_DUMP_PATH"
              curl_download() {
                if [ "$DUMP_INSECURE_SKIP_TLS_VERIFY" = "true" ]; then
                  curl -k -D - -fsSL --retry 3 --retry-delay 5 "$@"
                else
                  curl -D - -fsSL --retry 3 --retry-delay 5 "$@"
                fi
              }
              if [ "$DUMP_INSECURE_SKIP_TLS_VERIFY" = "true" ]; then
                echo "WARNING: TLS certificate verification is disabled (-k)"
              fi
              case "$DUMP_AUTH_TYPE" in
                basic)
                  curl_download -u "$DUMP_AUTH_VALUE" -o "$LOCAL_DUMP_PATH" "$FULL_URL"
                  ;;
                bearer)
                  curl_download -H "Authorization: Bearer $DUMP_AUTH_VALUE" -o "$LOCAL_DUMP_PATH" "$FULL_URL"
                  ;;
                none)
                  curl_download -o "$LOCAL_DUMP_PATH" "$FULL_URL"
                  ;;
                *)
                  echo "Unknown DUMP_AUTH_TYPE: $DUMP_AUTH_TYPE (expected none, basic, bearer)" >&2
                  exit 1
                  ;;
              esac
              du -sh "$LOCAL_DUMP_PATH"
          env:
            - name: DUMP_BASE_URL
              value: {{ .Values.tcpg.auth.dumpBaseUrl | quote }}
            - name: DUMP_PATH
              value: {{ .Values.tcpg.auth.dumpPath | quote }}
            - name: DUMP_AUTH_TYPE
              value: {{ .Values.tcpg.auth.dumpAuth.type | quote }}
            - name: DUMP_INSECURE_SKIP_TLS_VERIFY
              value: {{ .Values.tcpg.auth.dumpInsecureSkipTlsVerify | quote }}
            {{- if ne .Values.tcpg.auth.dumpAuth.type "none" }}
            - name: DUMP_AUTH_VALUE
              valueFrom:
                secretKeyRef:
                  {{- if .Values.tcpg.auth.existingDumpAuthSecret.name }}
                  name: {{ .Values.tcpg.auth.existingDumpAuthSecret.name | quote }}
                  key: {{ .Values.tcpg.auth.existingDumpAuthSecret.key | quote }}
                  {{- else }}
                  name: {{ include "tcpg.loadSecretName" . }}
                  key: DUMP_AUTH_VALUE
                  {{- end }}
            {{- end }}
          volumeMounts:
            - name: dump
              mountPath: /dump
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: pg
          image: "{{ .Values.tcpg.image.repository }}:{{ .Values.tcpg.image.tag }}"
          imagePullPolicy: {{ .Values.tcpg.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.tcpg.containerSecurityContext | nindent 12 }}
          {{- if .Values.tcpg.auth.dumpPath }}
          command:
            - /bin/sh
            - /etc/postgres-wrapper/entrypoint-wrapper.sh
          args:
            - postgres
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- if .Values.tcpg.auth.dumpPath }}
            - name: PG_PVC_NAME
              value: {{ template "tcpg.fullname" . }}-pg-data
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ template "tcpg.pgSecretName" . }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            # Restore can take a while; allow up to 30 min on first start.
            failureThreshold: 180
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.tcpg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run-postgresql
              mountPath: /var/run/postgresql
            {{- if .Values.tcpg.auth.dumpPath }}
            # /dump is RW: 10-restore.sh deletes the dump after a successful restore to free the emptyDir.
            - name: dump
              mountPath: /dump
            - name: restore-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: entrypoint-wrapper
              mountPath: /etc/postgres-wrapper
              readOnly: true
            {{- end }}
      {{- with .Values.tcpg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tcpg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tcpg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: pg-data
          {{- if .Values.tcpg.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ template "tcpg.fullname" . }}-pg-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: run-postgresql
          emptyDir: {}
        {{- if .Values.tcpg.auth.dumpPath }}
        - name: dump
          emptyDir: {}
        - name: restore-script
          configMap:
            name: {{ template "tcpg.fullname" . }}-restore
            defaultMode: 0755
            items:
              - key: 10-restore.sh
                path: 10-restore.sh
        - name: entrypoint-wrapper
          configMap:
            name: {{ template "tcpg.fullname" . }}-restore
            defaultMode: 0755
            items:
              - key: entrypoint-wrapper.sh
                path: entrypoint-wrapper.sh
        {{- end }}
{{- end }}
