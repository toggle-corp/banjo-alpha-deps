# Alpha-environment defaults for banjo-alpha-deps on the tc cluster.
#
# Apply on top of your per-install overlay (credentials, dump URL, etc.):
#   helm upgrade --install <release> ./chart \
#     -f chart/values/alpha.yaml \
#     -f my-overlay.yaml
#
# Conventions used below:
#   - `fullnameOverride` pins a fixed name (e.g. "tcpg") so resources are
#     `<name>-*` instead of `<release>-<name>-*`. Makes DNS names stable across
#     releases and predictable from app configs.
#   - `storageClass: local-path` uses the node's local disk via Rancher's
#     local-path-provisioner. Sizes are ignored by the provisioner (node disk
#     is the only limit) — the `size:` values here exist only to satisfy the
#     PVC schema.
#   - `nodeAffinity` steers pods off RAID nodes. Alpha workloads are
#     disposable, so we leave the RAID pool for production-grade services.

tcpg:
  # Stable name → predictable Service DNS: `tcpg.<namespace>.svc.cluster.local`.
  fullnameOverride: "tcpg"
  # Memory request == limit (1Gi) keeps Postgres in the Guaranteed QoS class.
  # CPU burstable from 0.1 → 2 cores for dump restore / ad-hoc queries.
  resources:
    requests:
      cpu: 0.1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 1Gi

  auth:
    # Alpha dump hosts present self-signed / internal-CA certs. Safe here;
    # never flip this on in production.
    dumpInsecureSkipTlsVerify: true

  persistence:
    enabled: true
    storageClass: "local-path"
    size: 1Gi  # NOTE: ignored by local-path (node disk is the real limit)

  affinity:
    nodeAffinity:
      # Keep alpha databases off RAID nodes — RAID is reserved for prod.
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

# Garage runs in single-node mode for alpha. Two knobs must agree:
#   - deployment.replicaCount  → pod count
#   - garage.replicationFactor → copies of data garage keeps per object
# If replicationFactor > replicaCount, writes fail with "not enough nodes".
# (The nested `garage.garage.*` key is not a typo — the outer `garage:` is the
# subchart gate; the inner one maps to Garage's own garage.toml settings.)
garage:
  # Stable name
  fullnameOverride: "garage"
  ingress:
    s3:
      api:
        enabled: true
        # TODO(traefik): Garage stays on nginx for now. Its vendored chart
        # renders ingress annotations with toYaml (not tpl) and must not be
        # hand-edited, so the Traefik middleware-reference namespace can't be
        # resolved cleanly. Resolve before migrating Garage to Traefik.
        className: "nginx"
  deployment:
    replicaCount: 1
  garage:
    replicationFactor: "1"
  resources:
    requests:
      cpu: 0.1
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1Gi
  persistence:
    enabled: true
    meta:
      storageClass: "local-path"
      size: 100Mi  # NOTE: ignored by local-path
    data:
      storageClass: "local-path"
      size: 100Mi  # NOTE: ignored by local-path
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

# MinIO standalone for alpha. Image-repository overrides to bitnamilegacy/*
# live in the chart's top-level values.yaml — alpha just picks the topology.
minio:
  # Your per-install overlay MUST set `minio.ingress.hostname` to the real S3 API
  # host. The parent chart derives S3_ENDPOINT_URL from it (see
  # templates/minio/secret.yaml); rendering fails closed if it's left at the
  # `minio.local` placeholder (or set minioConfig.endpointUrl explicitly).
  #
  # Stable name → API DNS: `minio.<namespace>.svc.cluster.local:9000`.
  fullnameOverride: "minio"
  disableWebUI: true
  mode: standalone
  console:
    enabled: false
  ingress:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      # Per-request body cap (NOT a per-object limit), enforced by the Traefik
      # Middleware `minio-body-limit` (rendered by the parent chart from
      # minioConfig.maxRequestBodyBytes). Requires a Traefik ingress. The
      # `{{ .Release.Namespace }}` token below is left LITERAL on purpose — the
      # MinIO subchart resolves it via tpl at render time.
      traefik.ingress.kubernetes.io/router.middlewares: '{{ .Release.Namespace }}-minio-body-limit@kubernetescrd'
  defaultBuckets: ""
  provisioning:
    enabled: true
    resourcesPreset: "nano"
    cleanupAfterFinished:
      enabled: true
  resources:
    requests:
      cpu: 0.1
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1Gi
  global:
    defaultStorageClass: "local-path"
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 1Gi  # NOTE: ignored by local-path
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

# Parent-chart-managed MinIO/S3 settings. Here we opt into the Traefik
# body-limit Middleware (rendered by the parent chart, wired via the
# router.middlewares annotation above). The caps are PER-REQUEST, not
# per-object, and require the Traefik ingress controller.
minioConfig:
  maxRequestBodyBytes: 104857600  # 100 MiB — per-request cap
  memRequestBodyBytes: 52428800   # 50 MiB — held in memory before spilling to disk

dragonfly:
  # Stable name → Service DNS: `dragonfly.<namespace>.svc.cluster.local:6379`.
  fullnameOverride: "dragonfly"
  # Single-replica for alpha (no HA, no snapshot replication). Dragonfly has no
  # separate replicationFactor — `replicaCount: 1` is the only knob needed.
  replicaCount: 1
  resources:
    requests:
      cpu: 0.1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 1Gi

  storage:
    enabled: true
    storageClassName: "local-path"
    requests: 128Mi  # NOTE: ignored by local-path

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"
