suite: azurite storage-credential bootstrap job
# The azurite-storage-credential Secret is not chart-rendered: a pre-install/
# pre-upgrade Helm-hook Job creates it against the LIVE cluster (GitOps-safe — no
# `lookup`). These tests assert on the Job's static, render-time-computed env and
# the fail-closed validations; the three-state key logic runs in the container
# shell and is exercised by the e2e suite.
templates:
  - templates/azurite/secret-bootstrap-job.yaml
release:
  name: my-release
  namespace: alpha-3
set:
  azurite.enabled: true
tests:
  - it: renders the bootstrap Job when azurite is enabled
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Job }
      - equal: { path: metadata.name, value: azurite-secret-bootstrap }

  - it: renders nothing when azurite is disabled
    set:
      azurite.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: carries only the helm hook annotations at weight 0, plus sync-wave 0
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/hook"]'
          value: pre-install,pre-upgrade
      - equal:
          path: 'metadata.annotations["helm.sh/hook-weight"]'
          value: "0"
      - equal:
          path: 'metadata.annotations["helm.sh/hook-delete-policy"]'
          value: before-hook-creation
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "0"
      - notExists:
          path: 'metadata.annotations["argocd.argoproj.io/hook"]'

  - it: does not apply commonAnnotations to the hook Job itself
    set:
      azurite.commonAnnotations:
        argocd.argoproj.io/sync-wave: "-1"
    asserts:
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "0"

  - it: uses the pinned bootstrap image, shared SA and restricted-PSS context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: alpine/k8s:1.31.1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-release-secret-bootstrap
      - equal: { path: spec.template.spec.restartPolicy, value: OnFailure }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]

  # --- Static env computed at render time ----------------------------------

  - it: defaults to the in-cluster path-style endpoint over http
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SECRET_NAME, value: azurite-storage-credential }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AZ_ACCOUNT_NAME, value: devstoreaccount1 }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZ_BLOB_ENDPOINT
            value: http://azurite.alpha-3.svc.cluster.local:10000/devstoreaccount1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AZ_PROTOCOL, value: http }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AZ_ACCOUNT_KEY_EXPLICIT, value: "" }

  - it: tracks a remapped Service port and a renamed account
    set:
      azurite.service.blobPort: 80
      azurite.account.name: myapp01
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZ_BLOB_ENDPOINT
            value: http://azurite.alpha-3.svc.cluster.local:80/myapp01

  - it: switches to the ingress host over https when the ingress is on
    # SAS URLs are minted from this endpoint, so they must be browser-reachable.
    set:
      azurite.ingress.enabled: true
      azurite.ingress.hostname: blob.alpha-3.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZ_BLOB_ENDPOINT
            value: https://blob.alpha-3.example.com/devstoreaccount1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AZ_PROTOCOL, value: https }

  - it: uses endpointUrl verbatim (trailing slash trimmed) over the ingress
    set:
      azurite.ingress.enabled: true
      azurite.ingress.hostname: blob.alpha-3.example.com
      azurite.endpointUrl: http://files.internal/devstoreaccount1/
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZ_BLOB_ENDPOINT
            value: http://files.internal/devstoreaccount1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AZ_PROTOCOL, value: http }

  - it: rejects an endpointUrl that does not end in /<account>
    # Azurite is path-style: without the account segment every request would
    # treat the container name as the account and fail at runtime.
    set:
      azurite.endpointUrl: https://blob.example.com
    asserts:
      - failedTemplate:
          errorMessage: 'azurite.endpointUrl "https://blob.example.com" must end in /devstoreaccount1 — Azurite is path-style, so the account is the first path segment of every request'

  - it: fails closed when the ingress is on without a hostname
    set:
      azurite.ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: azurite.ingress.hostname is required when azurite.ingress.enabled is true

  - it: honours a secretName override
    set:
      azurite.secretName: my-blob-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SECRET_NAME, value: my-blob-secret }

  # --- Account key ---------------------------------------------------------

  - it: passes a pinned base64 key through for the explicit (overwrite) branch
    set:
      azurite.account.key: "ET5DG3N2ZsTNCsV87JyMCFHjMwoW2sgQQY0sauQVz4kSb1mGaxe2vquihRloYRRz0wzli5V0qrrixOMNgJLyeg=="
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZ_ACCOUNT_KEY_EXPLICIT
            value: "ET5DG3N2ZsTNCsV87JyMCFHjMwoW2sgQQY0sauQVz4kSb1mGaxe2vquihRloYRRz0wzli5V0qrrixOMNgJLyeg=="

  - it: rejects a key that is not base64
    set:
      azurite.account.key: "not base64!"
    asserts:
      - failedTemplate:
          errorMessage: "azurite.account.key must be base64 (Azure clients decode it to sign requests). Generate one with: head -c 64 /dev/urandom | base64 -w0"

  - it: rejects a key with a truncated base64 length
    set:
      azurite.account.key: "abcde"
    asserts:
      - failedTemplate:
          errorMessage: "azurite.account.key must be base64 (Azure clients decode it to sign requests). Generate one with: head -c 64 /dev/urandom | base64 -w0"

  - it: rejects an invalid account name before it reaches the Secret
    set:
      azurite.account.name: ab
    asserts:
      - failedTemplate:
          errorMessage: 'azurite.account.name "ab" is not a valid storage account name — use 3-24 lowercase letters and digits'

  # --- Labels / annotations stamped onto the created Secret ----------------

  - it: stamps only the two honest identity labels onto the Secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_LABELS
            value: "app.kubernetes.io/name=azurite app.kubernetes.io/component=object-store"

  - it: marks the Secret Prune=false / IgnoreExtraneous, plus commonAnnotations, one per line
    set:
      azurite.commonAnnotations:
        owner: platform
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_ANNOTATIONS
            value: "argocd.argoproj.io/compare-options=IgnoreExtraneous\nargocd.argoproj.io/sync-options=Prune=false\nowner=platform"

  - it: keeps an annotation value with spaces on one line
    # The script splits on newlines only, so this stays ONE kubectl argument.
    # Space-joined, it split into `store`, `for`, `app` and failed the hook.
    set:
      azurite.commonAnnotations:
        description: blob store for app
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_ANNOTATIONS
            value: "argocd.argoproj.io/compare-options=IgnoreExtraneous\nargocd.argoproj.io/sync-options=Prune=false\ndescription=blob store for app"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "(?s)set -f\n.*IFS='\n'"

  - it: never lets a commonAnnotation replace Prune=false
    set:
      azurite.commonAnnotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_ANNOTATIONS
            value: "argocd.argoproj.io/compare-options=IgnoreExtraneous\nargocd.argoproj.io/sync-options=Prune=false"

  - it: labels an uppercase HTTPS endpointUrl as https
    set:
      azurite.endpointUrl: HTTPS://blob.example.com/devstoreaccount1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AZ_PROTOCOL, value: https }

  - it: keeps the Job name and pod label within 63 characters
    release:
      name: a-release-name-that-is-long-enough-to-overflow-it
    set:
      azurite.fullnameOverride: ""
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,63}$"
      - matchRegex:
          path: metadata.name
          pattern: "[a-z0-9]$"
      - matchRegex:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          pattern: "^azurite-secret-bootstrap$"

  - it: writes all four consumer keys from the script
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)AZURE_STORAGE_ACCOUNT_NAME=.*AZURE_STORAGE_ACCOUNT_KEY=.*AZURE_STORAGE_BLOB_ENDPOINT=.*AZURE_STORAGE_CONNECTION_STRING='

  - it: keeps the Job pod out of the azurite Service selector
    # A running pod with no readiness probe is Ready, so a pod matching the
    # Service selector would receive blob traffic during every upgrade.
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: azurite-secret-bootstrap
            app.kubernetes.io/instance: my-release
