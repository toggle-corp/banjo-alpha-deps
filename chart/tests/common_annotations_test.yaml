suite: commonAnnotations
templates:
  - postgres.yaml
  - service.yaml
  - pvc.yaml
  - pdb.yaml
  - secrets.yaml
  - configmap.yaml
release:
  name: my-release
tests:
  - it: omits annotations on every resource by default
    set:
      auth.dumpBaseUrl: https://example.com
      auth.dumpPath: /d.dump
      podDisruptionBudget.enabled: true
    asserts:
      - notExists: { path: metadata.annotations, template: postgres.yaml }
      - notExists: { path: metadata.annotations, template: service.yaml }
      - notExists: { path: metadata.annotations, template: pvc.yaml }
      - notExists: { path: metadata.annotations, template: pdb.yaml }
      - notExists: { path: metadata.annotations, template: secrets.yaml }
      - notExists: { path: metadata.annotations, template: configmap.yaml }

  - it: applies commonAnnotations to every resource's metadata
    set:
      auth.dumpBaseUrl: https://example.com
      auth.dumpPath: /d.dump
      podDisruptionBudget.enabled: true
      commonAnnotations:
        argocd.argoproj.io/sync-wave: "-1"
        helm.sh/hook-weight: "5"
    asserts:
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: postgres.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: service.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: pvc.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: pdb.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: secrets.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: configmap.yaml
      - equal:
          path: 'metadata.annotations["helm.sh/hook-weight"]'
          value: "5"
          template: postgres.yaml
