suite: commonAnnotations
templates:
  - tcpg/postgres.yaml
  - tcpg/service.yaml
  - tcpg/pvc.yaml
  - tcpg/pdb.yaml
  - tcpg/secrets.yaml
  - tcpg/configmap.yaml
set:
  tcpg.enabled: true
release:
  name: my-release
tests:
  - it: omits annotations on every resource by default
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.podDisruptionBudget.enabled: true
    asserts:
      - notExists: { path: metadata.annotations, template: tcpg/postgres.yaml }
      - notExists: { path: metadata.annotations, template: tcpg/service.yaml }
      - notExists: { path: metadata.annotations, template: tcpg/pvc.yaml }
      - notExists: { path: metadata.annotations, template: tcpg/pdb.yaml }
      - notExists: { path: metadata.annotations, template: tcpg/secrets.yaml }
      - notExists: { path: metadata.annotations, template: tcpg/configmap.yaml }

  - it: applies commonAnnotations to every resource's metadata
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.podDisruptionBudget.enabled: true
      tcpg.commonAnnotations:
        argocd.argoproj.io/sync-wave: "-1"
        helm.sh/hook-weight: "5"
    asserts:
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: tcpg/postgres.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: tcpg/service.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: tcpg/pvc.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: tcpg/pdb.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: tcpg/secrets.yaml
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "-1"
          template: tcpg/configmap.yaml
      - equal:
          path: 'metadata.annotations["helm.sh/hook-weight"]'
          value: "5"
          template: tcpg/postgres.yaml
