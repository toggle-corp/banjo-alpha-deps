suite: minio s3-credential secret
# The lookup-preserve precedence (existing secret value reused across upgrades)
# CANNOT be unit-tested: `lookup` returns nil under `helm template` /
# helm-unittest (no live cluster), so only the values-override and
# random-generation branches are exercised here.
templates:
  - templates/minio/secret.yaml
  # Cross-chart template — needed for the "minio reads creds back" assertion.
  - charts/minio/templates/application.yaml
tests:
  - it: renders the secret with all four S3_ keys
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Secret }
      - exists: { path: stringData.S3_ENDPOINT_URL }
      - exists: { path: stringData.S3_REGION }
      - exists: { path: stringData.S3_ACCESS_KEY_ID }
      - exists: { path: stringData.S3_SECRET_ACCESS_KEY }

  - it: S3_ACCESS_KEY_ID defaults to minio
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - equal: { path: stringData.S3_ACCESS_KEY_ID, value: minio }

  - it: S3_ACCESS_KEY_ID honors minioConfig.accessKeyId override
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
      minioConfig.accessKeyId: myappkey
    asserts:
      - equal: { path: stringData.S3_ACCESS_KEY_ID, value: myappkey }

  - it: S3_SECRET_ACCESS_KEY is non-empty when unset (randomly generated)
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - notMatchRegex: { path: stringData.S3_SECRET_ACCESS_KEY, pattern: "^$" }

  - it: S3_SECRET_ACCESS_KEY honors minioConfig.secretAccessKey override
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
      minioConfig.secretAccessKey: my-fixed-secret
    asserts:
      - equal: { path: stringData.S3_SECRET_ACCESS_KEY, value: my-fixed-secret }

  - it: S3_ENDPOINT_URL is derived from minio.ingress.hostname
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - equal: { path: stringData.S3_ENDPOINT_URL, value: https://s3.example.com }

  - it: S3_ENDPOINT_URL honors minioConfig.endpointUrl override
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: false
      minioConfig.endpointUrl: http://minio.svc.cluster.local:9000
    asserts:
      - equal:
          path: stringData.S3_ENDPOINT_URL
          value: http://minio.svc.cluster.local:9000

  - it: S3_REGION defaults to us-east-1
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - equal: { path: stringData.S3_REGION, value: us-east-1 }

  - it: S3_REGION is honored when overridden
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
      minioConfig.region: eu-west-1
    asserts:
      - equal: { path: stringData.S3_REGION, value: eu-west-1 }

  - it: fails closed when ingress hostname is empty and no endpointUrl
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: ""
    asserts:
      - failedTemplate:
          errorMessage: "minioConfig.endpointUrl is empty: set minio.ingress.hostname to your S3 API host (and enable minio.ingress), or set minioConfig.endpointUrl explicitly"

  - it: fails closed when hostname is the minio.local placeholder
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: minio.local
    asserts:
      - failedTemplate:
          errorMessage: "minioConfig.endpointUrl is empty: set minio.ingress.hostname to your S3 API host (and enable minio.ingress), or set minioConfig.endpointUrl explicitly"

  - it: secret is named after minio.auth.existingSecret (default)
    template: templates/minio/secret.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - equal: { path: metadata.name, value: minio-s3-credential }

  - it: minio reads root user/password back from the s3-credential secret
    template: charts/minio/templates/application.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
      minio.mode: standalone
      # Force env-var (secretKeyRef) form; usePasswordFiles (default) would mount
      # the same secret as files instead. Either way the existingSecret + keys
      # are honored — this asserts the secretKeyRef wiring explicitly.
      minio.auth.usePasswordFiles: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: minio-s3-credential
                key: S3_ACCESS_KEY_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: minio-s3-credential
                key: S3_SECRET_ACCESS_KEY
