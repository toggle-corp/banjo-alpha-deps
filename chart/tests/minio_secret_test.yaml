suite: minio s3-credential bootstrap job
# The minio-s3-credential Secret is no longer chart-rendered: a pre-install/
# pre-upgrade Helm-hook Job (templates/minio/secret-bootstrap-job.yaml) creates
# it against the LIVE cluster (GitOps-safe — no `lookup`). These tests assert on
# the Job's static, render-time-computed env + the endpoint fail-closed logic.
# The runtime three-state credential logic lives in the container shell.
templates:
  - minio/secret-bootstrap-job.yaml
  # Cross-chart template — needed for the "minio reads creds back" assertion.
  - charts/minio/templates/application.yaml
tests:
  # --- Gating ---------------------------------------------------------------
  - it: renders the bootstrap Job when minio is enabled
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Job }

  - it: renders nothing when minio is disabled
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  # --- Hook annotations -----------------------------------------------------
  - it: carries the helm hook annotations at weight 0
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/hook"]'
          value: pre-install,pre-upgrade
      - equal:
          path: 'metadata.annotations["helm.sh/hook-weight"]'
          value: "0"
      - equal:
          path: 'metadata.annotations["helm.sh/hook-delete-policy"]'
          value: before-hook-creation
      - notExists:
          path: 'metadata.annotations["argocd.argoproj.io/hook"]'

  # --- Image / spec knobs ---------------------------------------------------
  - it: uses the pinned alpine/k8s image and shared SA
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: alpine/k8s:1.31.1
      - equal: { path: spec.template.spec.restartPolicy, value: OnFailure }
      - equal: { path: spec.backoffLimit, value: 3 }
      - equal: { path: spec.activeDeadlineSeconds, value: 120 }
      - matchRegex:
          path: spec.template.spec.serviceAccountName
          pattern: "secret-bootstrap"

  # --- Static env computed at render time -----------------------------------
  - it: passes the four S3_* env (key id, region, endpoint, secret name)
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SECRET_NAME, value: minio-s3-credential }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_ACCESS_KEY_ID, value: minio }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_REGION, value: us-east-1 }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_ENDPOINT_URL, value: https://s3.example.com }

  - it: passes the namespace via fieldRef
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: honors minioConfig.accessKeyId / region overrides
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
      minioConfig.accessKeyId: myappkey
      minioConfig.region: eu-west-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_ACCESS_KEY_ID, value: myappkey }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_REGION, value: eu-west-1 }

  - it: honors minioConfig.endpointUrl override (no ingress)
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: false
      minioConfig.endpointUrl: http://minio.svc.cluster.local:9000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT_URL
            value: http://minio.svc.cluster.local:9000

  - it: passes an explicit secret key through S3_SECRET_ACCESS_KEY_EXPLICIT
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
      minioConfig.secretAccessKey: my-fixed-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_SECRET_ACCESS_KEY_EXPLICIT, value: my-fixed-secret }

  - it: leaves S3_SECRET_ACCESS_KEY_EXPLICIT empty when unset
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_SECRET_ACCESS_KEY_EXPLICIT, value: "" }

  - it: sets HOME=/tmp, the minimal identity SECRET_LABELS, and the argo prune/compare SECRET_ANNOTATIONS
    template: minio/secret-bootstrap-job.yaml
    release:
      name: my-release
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: HOME, value: /tmp }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_LABELS
            value: "app.kubernetes.io/name=minio app.kubernetes.io/component=object-store"
      # The out-of-band Secret must NOT carry ArgoCD's default tracking labels, or
      # a default-config controller adopts it as app-owned and auto-prunes it.
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="SECRET_LABELS")].value
          pattern: "app.kubernetes.io/instance"
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="SECRET_LABELS")].value
          pattern: "app.kubernetes.io/managed-by"
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="SECRET_LABELS")].value
          pattern: "helm.sh/chart"
      # MinIO has no commonAnnotations, but SECRET_ANNOTATIONS still carries the two
      # argo opts so ArgoCD never adopts or prunes the out-of-band Secret.
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SECRET_ANNOTATIONS, value: "argocd.argoproj.io/sync-options=Prune=false argocd.argoproj.io/compare-options=IgnoreExtraneous" }

  # --- ArgoCD ordering (sync-wave) ------------------------------------------
  - it: carries argocd sync-wave 0 so ArgoCD orders it after the RBAC
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "0"

  # --- Pod securityContext --------------------------------------------------
  - it: runs as a numeric non-root user so runAsNonRoot is satisfiable
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 65534
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  # --- Container resources --------------------------------------------------
  - it: sets resource requests and limits on the bootstrap container
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 32Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 64Mi

  # --- Render-time fail-closed validations (preserved exact messages) --------
  - it: fails closed when ingress hostname is empty and no endpointUrl
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: ""
    asserts:
      - failedTemplate:
          errorMessage: "minioConfig.endpointUrl is empty: set minio.ingress.hostname to your S3 API host (and enable minio.ingress), or set minioConfig.endpointUrl explicitly"

  - it: fails closed when hostname is the minio.local placeholder
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: minio.local
    asserts:
      - failedTemplate:
          errorMessage: "minioConfig.endpointUrl is empty: set minio.ingress.hostname to your S3 API host (and enable minio.ingress), or set minioConfig.endpointUrl explicitly"

  - it: fails closed when accessKeyId is empty
    template: minio/secret-bootstrap-job.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
      minioConfig.accessKeyId: ""
    asserts:
      - failedTemplate:
          errorMessage: "minioConfig.accessKeyId required"

  # --- Subchart still reads creds back from the same Secret name -------------
  - it: minio reads root user/password back from the s3-credential secret
    template: charts/minio/templates/application.yaml
    set:
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
      minio.mode: standalone
      # Force env-var (secretKeyRef) form; usePasswordFiles (default) would mount
      # the same secret as files instead. Either way the existingSecret + keys
      # are honored — this asserts the secretKeyRef wiring explicitly.
      minio.auth.usePasswordFiles: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: minio-s3-credential
                key: S3_ACCESS_KEY_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: minio-s3-credential
                key: S3_SECRET_ACCESS_KEY
