suite: tcpg secret bootstrap job
# The tcpg-pg-credential Secret is no longer chart-rendered: a pre-install/
# pre-upgrade Helm-hook Job (templates/tcpg/secret-bootstrap-job.yaml) creates
# it against the LIVE cluster (GitOps-safe — no `lookup`). These tests assert on
# that Job's static, render-time-computed env + hook wiring. The runtime
# three-state credential logic (explicit / preserve / generate) lives in the
# container shell and is not unit-testable here.
tests:
  # --- Job presence / gating ------------------------------------------------
  - it: renders the bootstrap Job when tcpg is enabled
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
    release:
      name: my-release
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Job }
      - matchRegex: { path: metadata.name, pattern: "tcpg" }

  - it: renders nothing when tcpg is disabled
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  # --- Hook annotations -----------------------------------------------------
  - it: carries the helm hook annotations at weight 0
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/hook"]'
          value: pre-install,pre-upgrade
      - equal:
          path: 'metadata.annotations["helm.sh/hook-weight"]'
          value: "0"
      - equal:
          path: 'metadata.annotations["helm.sh/hook-delete-policy"]'
          value: before-hook-creation
      # Must NOT carry an explicit Argo hook (would suppress the helm-hook path).
      - notExists:
          path: 'metadata.annotations["argocd.argoproj.io/hook"]'

  # --- Image ----------------------------------------------------------------
  - it: uses the pinned alpine/k8s image by default
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: alpine/k8s:1.31.1

  - it: honors the secretBootstrap.image override
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      secretBootstrap.image.repository: example.com/kubectl
      secretBootstrap.image.tag: v9.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/kubectl:v9.9.9

  # --- Job spec knobs -------------------------------------------------------
  - it: sets restartPolicy, backoffLimit, activeDeadlineSeconds and the shared SA
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
    asserts:
      - equal: { path: spec.template.spec.restartPolicy, value: OnFailure }
      - equal: { path: spec.backoffLimit, value: 3 }
      - equal: { path: spec.activeDeadlineSeconds, value: 120 }
      - matchRegex:
          path: spec.template.spec.serviceAccountName
          pattern: "secret-bootstrap"

  - it: does not propagate commonAnnotations onto the hook Job
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      tcpg.commonAnnotations:
        argocd.argoproj.io/sync-wave: "-1"
    asserts:
      # The Job sets its OWN sync-wave to "0" — commonAnnotations ("-1") must NOT
      # leak onto the hook Job's metadata and override it.
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "0"

  # --- ArgoCD ordering (sync-wave) ------------------------------------------
  - it: carries argocd sync-wave 0 so ArgoCD orders it after the RBAC
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
    asserts:
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]'
          value: "0"

  # --- Pod securityContext --------------------------------------------------
  - it: runs as a numeric non-root user so runAsNonRoot is satisfiable
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 65534
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      # Required by the restricted Pod Security Standard. Without both of these
      # the hook Job is rejected at admission in a namespace enforcing
      # `restricted`, which fails the whole install at pre-install and leaves
      # the credential Secret un-bootstrapped.
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]

  # --- Container resources --------------------------------------------------
  - it: sets resource requests and limits on the bootstrap container
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 32Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 64Mi

  # --- Static env computed at render time -----------------------------------
  - it: computes the static Postgres connection env from values
    template: tcpg/secret-bootstrap-job.yaml
    release:
      name: my-release
      namespace: my-ns
    set:
      tcpg.enabled: true
      tcpg.init.database: appdb
      tcpg.init.username: appuser
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PG_DB, value: appdb }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PG_USER, value: appuser }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PG_HOST, value: tcpg.my-ns.svc.cluster.local }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PG_PORT, value: "5432" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SECRET_NAME, value: tcpg-pg-credential }

  - it: passes the namespace via fieldRef
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: url-encodes reserved chars in user/db/password env (ported from URI test)
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      tcpg.init.username: "u s@r"
      tcpg.init.password: "p@ss/w:rd"
      tcpg.init.database: "my db"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PG_USER_ENC, value: "u+s%40r" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PG_DB_ENC, value: "my+db" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PG_PASSWORD_EXPLICIT_ENC, value: "p%40ss%2Fw%3Ard" }

  - it: passes an explicit password through PG_PASSWORD_EXPLICIT verbatim
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      tcpg.init.password: hunter2-very-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PG_PASSWORD_EXPLICIT, value: hunter2-very-secret }

  - it: leaves PG_PASSWORD_EXPLICIT empty when no password is set
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      tcpg.init.password: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: PG_PASSWORD_EXPLICIT, value: "" }

  # --- HOME / label + annotation propagation env ----------------------------
  - it: sets HOME=/tmp and the identity SECRET_LABELS
    template: tcpg/secret-bootstrap-job.yaml
    release:
      name: my-release
    set:
      tcpg.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: HOME, value: /tmp }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_LABELS
            value: "app.kubernetes.io/name=tcpg app.kubernetes.io/component=database"
      # The out-of-band Secret must NOT carry ArgoCD's default tracking labels, or
      # a default-config controller adopts it as app-owned and auto-prunes it.
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="SECRET_LABELS")].value
          pattern: "app.kubernetes.io/instance"
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="SECRET_LABELS")].value
          pattern: "app.kubernetes.io/managed-by"
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="SECRET_LABELS")].value
          pattern: "helm.sh/chart"

  - it: SECRET_ANNOTATIONS always carries the argo prune/compare opts when commonAnnotations is unset
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SECRET_ANNOTATIONS, value: "argocd.argoproj.io/sync-options=Prune=false argocd.argoproj.io/compare-options=IgnoreExtraneous" }

  - it: prepends the argo prune/compare opts before any commonAnnotations in SECRET_ANNOTATIONS
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      tcpg.commonAnnotations:
        example.com/team: platform
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SECRET_ANNOTATIONS, value: "argocd.argoproj.io/sync-options=Prune=false argocd.argoproj.io/compare-options=IgnoreExtraneous example.com/team=platform" }

  - it: coerces non-string commonAnnotation values (bool/number) instead of emitting Go's %!s garbage
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      tcpg.commonAnnotations:
        reflector.v1.k8s.io/reflection-allowed: true
        argocd.argoproj.io/sync-wave: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SECRET_ANNOTATIONS, value: "argocd.argoproj.io/sync-options=Prune=false argocd.argoproj.io/compare-options=IgnoreExtraneous argocd.argoproj.io/sync-wave=5 reflector.v1.k8s.io/reflection-allowed=true" }

  - it: honors the tcpg.secretName override for SECRET_NAME
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      tcpg.secretName: my-custom-pg-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SECRET_NAME, value: my-custom-pg-secret }

  # --- Render-time validations (preserved from the old Secret template) ------
  - it: fails when database is empty
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      tcpg.init.database: ""
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.database is required"

  - it: fails when username is empty
    template: tcpg/secret-bootstrap-job.yaml
    set:
      tcpg.enabled: true
      tcpg.init.username: ""
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.username is required"
