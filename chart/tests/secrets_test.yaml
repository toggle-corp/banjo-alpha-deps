suite: secrets
templates:
  - secrets.yaml
release:
  name: my-release
tests:
  - it: renders only the pg-credential Secret by default (no load-credential)
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Secret }
      - equal: { path: metadata.name, value: my-release-tcpg-credential }
      - equal: { path: stringData.POSTGRES_DB, value: postgres }
      - equal: { path: stringData.POSTGRES_USER, value: postgres }
      - matchRegex:
          path: stringData.POSTGRES_PASSWORD
          pattern: ^[a-zA-Z0-9]{32}$
      - notExists: { path: stringData.DUMP_AUTH_VALUE }
      - equal: { path: type, value: Opaque }

  - it: uses supplied password verbatim
    set:
      auth.password: hunter2-very-secret
    asserts:
      - equal: { path: stringData.POSTGRES_PASSWORD, value: hunter2-very-secret }

  - it: emits a separate load-credential Secret for inline basic auth; pg-credential stays clean
    set:
      auth.dumpBaseUrl: https://example.com
      auth.dumpPath: /db.sql.gz
      auth.dumpAuth.type: basic
      auth.dumpAuth.value: user:pw
    asserts:
      - hasDocuments: { count: 2 }
      - documentIndex: 0
        equal: { path: metadata.name, value: my-release-tcpg-credential }
      - documentIndex: 0
        notExists: { path: stringData.DUMP_AUTH_VALUE }
      - documentIndex: 1
        equal: { path: metadata.name, value: my-release-tcpg-load-credential }
      - documentIndex: 1
        equal: { path: stringData.DUMP_AUTH_VALUE, value: "user:pw" }
      - documentIndex: 1
        equal: { path: type, value: Opaque }

  - it: stores inline bearer token in the load-credential Secret
    set:
      auth.dumpBaseUrl: https://example.com
      auth.dumpPath: /db.sql.gz
      auth.dumpAuth.type: bearer
      auth.dumpAuth.value: eyJhbGci-token
    asserts:
      - hasDocuments: { count: 2 }
      - documentIndex: 1
        equal: { path: stringData.DUMP_AUTH_VALUE, value: "eyJhbGci-token" }

  - it: omits load-credential Secret when existingDumpAuthSecret is set
    set:
      auth.dumpBaseUrl: https://example.com
      auth.dumpPath: /db.sql.gz
      auth.dumpAuth.type: basic
      auth.existingDumpAuthSecret.name: external-dump-auth
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: my-release-tcpg-credential }
      - notExists: { path: stringData.DUMP_AUTH_VALUE }

  - it: omits load-credential Secret when dumpAuth.type is none
    set:
      auth.dumpBaseUrl: https://example.com
      auth.dumpPath: /db.sql.gz
      auth.dumpAuth.value: leftover-from-earlier
    asserts:
      - hasDocuments: { count: 1 }
      - notExists: { path: stringData.DUMP_AUTH_VALUE }

  - it: fails when database is empty
    set:
      auth.database: ""
    asserts:
      - failedTemplate:
          errorMessage: "auth.database is required"

  - it: fails when username is empty
    set:
      auth.username: ""
    asserts:
      - failedTemplate:
          errorMessage: "auth.username is required"
