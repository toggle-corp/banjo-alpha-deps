suite: secrets
templates:
  - tcpg/secrets.yaml
release:
  name: my-release
tests:
  - it: renders only the pg-credential Secret by default (no load-credential)
    release:
      name: my-release
      namespace: my-ns
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Secret }
      - equal: { path: metadata.name, value: my-release-tcpg-pg-credential }
      - equal: { path: stringData.POSTGRES_DB, value: postgres }
      - equal: { path: stringData.POSTGRES_USER, value: postgres }
      - matchRegex:
          path: stringData.POSTGRES_PASSWORD
          pattern: ^[a-zA-Z0-9]{32}$
      - equal:
          path: stringData.POSTGRES_HOST
          value: my-release-tcpg.my-ns.svc.cluster.local
      - equal: { path: stringData.POSTGRES_PORT, value: "5432" }
      - matchRegex:
          path: stringData.POSTGRES_URI
          pattern: ^postgres://postgres:[a-zA-Z0-9]{32}@my-release-tcpg\.my-ns\.svc\.cluster\.local:5432/postgres$
      - notExists: { path: stringData.DUMP_AUTH_VALUE }
      - equal: { path: type, value: Opaque }

  - it: URL-encodes reserved chars in username/password/database for POSTGRES_URI
    set:
      tcpg.auth.username: "u s@r"
      tcpg.auth.password: "p@ss/w:rd"
      tcpg.auth.database: "my db"
    asserts:
      - equal:
          path: stringData.POSTGRES_URI
          value: postgres://u+s%40r:p%40ss%2Fw%3Ard@my-release-tcpg.NAMESPACE.svc.cluster.local:5432/my+db

  - it: uses supplied password verbatim
    set:
      tcpg.auth.password: hunter2-very-secret
    asserts:
      - equal: { path: stringData.POSTGRES_PASSWORD, value: hunter2-very-secret }

  - it: emits a separate load-credential Secret for inline basic auth; pg-credential stays clean
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /db.sql.gz
      tcpg.auth.dumpAuth.type: basic
      tcpg.auth.dumpAuth.value: user:pw
    asserts:
      - hasDocuments: { count: 2 }
      - documentIndex: 0
        equal: { path: metadata.name, value: my-release-tcpg-pg-credential }
      - documentIndex: 0
        notExists: { path: stringData.DUMP_AUTH_VALUE }
      - documentIndex: 1
        equal: { path: metadata.name, value: my-release-tcpg-load-credential }
      - documentIndex: 1
        equal: { path: stringData.DUMP_AUTH_VALUE, value: "user:pw" }
      - documentIndex: 1
        equal: { path: type, value: Opaque }

  - it: stores inline bearer token in the load-credential Secret
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /db.sql.gz
      tcpg.auth.dumpAuth.type: bearer
      tcpg.auth.dumpAuth.value: eyJhbGci-token
    asserts:
      - hasDocuments: { count: 2 }
      - documentIndex: 1
        equal: { path: stringData.DUMP_AUTH_VALUE, value: "eyJhbGci-token" }

  - it: omits load-credential Secret when existingDumpAuthSecret is set
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /db.sql.gz
      tcpg.auth.dumpAuth.type: basic
      tcpg.auth.existingDumpAuthSecret.name: external-dump-auth
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: my-release-tcpg-pg-credential }
      - notExists: { path: stringData.DUMP_AUTH_VALUE }

  - it: omits load-credential Secret when dumpAuth.type is none
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /db.sql.gz
      tcpg.auth.dumpAuth.value: leftover-from-earlier
    asserts:
      - hasDocuments: { count: 1 }
      - notExists: { path: stringData.DUMP_AUTH_VALUE }

  - it: fails when database is empty
    set:
      tcpg.auth.database: ""
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.auth.database is required"

  - it: fails when username is empty
    set:
      tcpg.auth.username: ""
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.auth.username is required"
