suite: secrets
templates:
  - tcpg/secrets.yaml
set:
  tcpg.enabled: true
release:
  name: my-release
tests:
  - it: renders only the pg-credential Secret by default (no restore-credential)
    release:
      name: my-release
      namespace: my-ns
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Secret }
      - equal: { path: metadata.name, value: tcpg-pg-credential }
      - equal: { path: stringData.POSTGRES_DB, value: postgres }
      - equal: { path: stringData.POSTGRES_USER, value: postgres }
      - matchRegex:
          path: stringData.POSTGRES_PASSWORD
          pattern: ^[a-zA-Z0-9]{32}$
      - equal:
          path: stringData.POSTGRES_HOST
          value: tcpg.my-ns.svc.cluster.local
      - equal: { path: stringData.POSTGRES_PORT, value: "5432" }
      - matchRegex:
          path: stringData.POSTGRES_URI
          pattern: ^postgres://postgres:[a-zA-Z0-9]{32}@tcpg\.my-ns\.svc\.cluster\.local:5432/postgres$
      - notExists: { path: stringData.RESTORE_AUTH_VALUE }
      - equal: { path: type, value: Opaque }

  - it: URL-encodes reserved chars in username/password/database for POSTGRES_URI
    set:
      tcpg.init.username: "u s@r"
      tcpg.init.password: "p@ss/w:rd"
      tcpg.init.database: "my db"
    asserts:
      - equal:
          path: stringData.POSTGRES_URI
          value: postgres://u+s%40r:p%40ss%2Fw%3Ard@tcpg.NAMESPACE.svc.cluster.local:5432/my+db

  - it: uses supplied password verbatim
    set:
      tcpg.init.password: hunter2-very-secret
    asserts:
      - equal: { path: stringData.POSTGRES_PASSWORD, value: hunter2-very-secret }

  - it: generates a non-empty random password when init.password is empty
    set:
      tcpg.init.password: ""
    asserts:
      - isNotEmpty: { path: stringData.POSTGRES_PASSWORD }
      - matchRegex:
          path: stringData.POSTGRES_PASSWORD
          pattern: ^[a-zA-Z0-9]{32}$

  - it: flows init.database/username into the canonical POSTGRES_DB/POSTGRES_USER keys
    set:
      tcpg.init.database: appdb
      tcpg.init.username: appuser
    asserts:
      - equal: { path: stringData.POSTGRES_DB, value: appdb }
      - equal: { path: stringData.POSTGRES_USER, value: appuser }

  - it: emits a separate restore-credential Secret for inline basic auth; pg-credential stays clean
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /db.sql.gz
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.value: user:pw
    asserts:
      - hasDocuments: { count: 2 }
      - documentIndex: 0
        equal: { path: metadata.name, value: tcpg-pg-credential }
      - documentIndex: 0
        notExists: { path: stringData.RESTORE_AUTH_VALUE }
      - documentIndex: 1
        equal: { path: metadata.name, value: tcpg-restore-credential }
      - documentIndex: 1
        equal: { path: stringData.RESTORE_AUTH_VALUE, value: "user:pw" }
      - documentIndex: 1
        equal: { path: type, value: Opaque }

  - it: stores inline bearer token in the restore-credential Secret
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /db.sql.gz
      tcpg.init.restore.auth.type: bearer
      tcpg.init.restore.auth.value: eyJhbGci-token
    asserts:
      - hasDocuments: { count: 2 }
      - documentIndex: 1
        equal: { path: stringData.RESTORE_AUTH_VALUE, value: "eyJhbGci-token" }

  - it: omits restore-credential Secret when existingSecret is set
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /db.sql.gz
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.existingSecret.name: external-restore-auth
      tcpg.init.restore.auth.existingSecret.key: RESTORE_AUTH_VALUE
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: tcpg-pg-credential }
      - notExists: { path: stringData.RESTORE_AUTH_VALUE }

  - it: omits restore-credential Secret when restore.auth.type is none
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /db.sql.gz
      tcpg.init.restore.auth.value: leftover-from-earlier
    asserts:
      - hasDocuments: { count: 1 }
      - notExists: { path: stringData.RESTORE_AUTH_VALUE }

  - it: omits restore-credential Secret when restore is disabled even with inline auth set
    set:
      tcpg.init.restore.enabled: false
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.value: user:pw
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: tcpg-pg-credential }
      - notExists: { path: stringData.RESTORE_AUTH_VALUE }

  - it: fails when database is empty
    set:
      tcpg.init.database: ""
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.database is required"

  - it: fails when username is empty
    set:
      tcpg.init.username: ""
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.username is required"
