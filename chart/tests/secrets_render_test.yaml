suite: tcpg secrets.yaml (restore-credential only)
# tcpg/secrets.yaml no longer renders tcpg-pg-credential (moved to a bootstrap
# Job). It renders ONLY the user-supplied restore-credential Secret, and only
# when inline restore auth is configured.
templates:
  - tcpg/secrets.yaml
set:
  tcpg.enabled: true
release:
  name: my-release
tests:
  - it: renders nothing by default (no pg-credential, no restore-credential)
    asserts:
      - hasDocuments: { count: 0 }

  - it: never renders a pg-credential Secret even with restore inline auth set
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /db.sql.gz
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.value: user:pw
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Secret }
      - equal: { path: metadata.name, value: tcpg-restore-credential }
      - notExists: { path: stringData.POSTGRES_PASSWORD }
      - notExists: { path: stringData.POSTGRES_URI }

  - it: emits the restore-credential Secret for inline basic auth
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /db.sql.gz
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.value: user:pw
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: tcpg-restore-credential }
      - equal: { path: stringData.RESTORE_AUTH_VALUE, value: "user:pw" }
      - equal: { path: type, value: Opaque }

  - it: stores an inline bearer token in the restore-credential Secret
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /db.sql.gz
      tcpg.init.restore.auth.type: bearer
      tcpg.init.restore.auth.value: eyJhbGci-token
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: stringData.RESTORE_AUTH_VALUE, value: "eyJhbGci-token" }

  - it: omits restore-credential Secret when existingSecret is set
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /db.sql.gz
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.existingSecret.name: external-restore-auth
      tcpg.init.restore.auth.existingSecret.key: RESTORE_AUTH_VALUE
    asserts:
      - hasDocuments: { count: 0 }

  - it: omits restore-credential Secret when restore.auth.type is none
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /db.sql.gz
      tcpg.init.restore.auth.value: leftover-from-earlier
    asserts:
      - hasDocuments: { count: 0 }

  - it: omits restore-credential Secret when restore is disabled
    set:
      tcpg.init.restore.enabled: false
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.value: user:pw
    asserts:
      - hasDocuments: { count: 0 }
