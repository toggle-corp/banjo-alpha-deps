suite: mailhog
# Per-instance SMTP catcher: Deployment + Service + optional maildir PVC,
# UI ingress and MH_AUTH_FILE basic auth, plus the consumer-facing
# mailhog-smtp-config Secret the app binds via envFrom.
templates:
  - templates/mailhog/deployment.yaml
  - templates/mailhog/service.yaml
  - templates/mailhog/pvc.yaml
  - templates/mailhog/ingress.yaml
  - templates/mailhog/secret.yaml
  - templates/mailhog/secret-ui-auth.yaml
release:
  name: my-release
  namespace: alpha-3
tests:
  - it: renders nothing at all by default (opt-in)
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders only the Deployment, Service and SMTP Secret when enabled
    set:
      mailhog.enabled: true
    asserts:
      - hasDocuments: { count: 1 }
        template: templates/mailhog/deployment.yaml
      - hasDocuments: { count: 1 }
        template: templates/mailhog/service.yaml
      - hasDocuments: { count: 1 }
        template: templates/mailhog/secret.yaml
      - hasDocuments: { count: 0 }
        template: templates/mailhog/pvc.yaml
      - hasDocuments: { count: 0 }
        template: templates/mailhog/ingress.yaml
      - hasDocuments: { count: 0 }
        template: templates/mailhog/secret-ui-auth.yaml

  - it: uses the fixed name mailhog, not <release>-mailhog
    set:
      mailhog.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: mailhog
        template: templates/mailhog/deployment.yaml
      - equal:
          path: metadata.name
          value: mailhog
        template: templates/mailhog/service.yaml

  - it: falls back to <release>-mailhog when the fullnameOverride is cleared
    set:
      mailhog.enabled: true
      mailhog.fullnameOverride: ""
    asserts:
      - equal:
          path: metadata.name
          value: my-release-mailhog
        template: templates/mailhog/service.yaml

  # --- Service -------------------------------------------------------------

  - it: exposes SMTP and the web UI on one ClusterIP Service
    set:
      mailhog.enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
        template: templates/mailhog/service.yaml
      - contains:
          path: spec.ports
          content:
            port: 1025
            targetPort: smtp
            protocol: TCP
            name: smtp
        template: templates/mailhog/service.yaml
      - contains:
          path: spec.ports
          content:
            port: 8025
            targetPort: http
            protocol: TCP
            name: http
        template: templates/mailhog/service.yaml

  - it: remaps the Service ports without touching the container ports
    # MailHog binds 1025/8025 itself; only the Service side is configurable.
    set:
      mailhog.enabled: true
      mailhog.service.smtpPort: 25
      mailhog.service.httpPort: 80
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 25
        template: templates/mailhog/service.yaml
      - equal:
          path: spec.ports[1].port
          value: 80
        template: templates/mailhog/service.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 1025
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 8025
        template: templates/mailhog/deployment.yaml

  # --- consumer Secret -----------------------------------------------------

  - it: publishes in-cluster SMTP settings for the app to envFrom
    set:
      mailhog.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: mailhog-smtp-config
        template: templates/mailhog/secret.yaml
      - equal:
          path: stringData.SMTP_HOST
          value: mailhog.alpha-3.svc.cluster.local
        template: templates/mailhog/secret.yaml
      - equal:
          path: stringData.SMTP_PORT
          value: "1025"
        template: templates/mailhog/secret.yaml
      - equal:
          path: stringData.SMTP_URL
          value: smtp://mailhog.alpha-3.svc.cluster.local:1025
        template: templates/mailhog/secret.yaml
      - equal:
          path: stringData.SMTP_USE_TLS
          value: "false"
        template: templates/mailhog/secret.yaml

  - it: tracks a remapped SMTP Service port in the consumer Secret
    set:
      mailhog.enabled: true
      mailhog.service.smtpPort: 2525
    asserts:
      - equal:
          path: stringData.SMTP_PORT
          value: "2525"
        template: templates/mailhog/secret.yaml
      - equal:
          path: stringData.SMTP_URL
          value: smtp://mailhog.alpha-3.svc.cluster.local:2525
        template: templates/mailhog/secret.yaml

  - it: honours a secretName override
    set:
      mailhog.enabled: true
      mailhog.secretName: my-smtp
    asserts:
      - equal:
          path: metadata.name
          value: my-smtp
        template: templates/mailhog/secret.yaml

  # --- storage -------------------------------------------------------------

  - it: uses memory storage and mounts no volumes by default
    set:
      mailhog.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: MH_STORAGE, value: memory }
        template: templates/mailhog/deployment.yaml
      - notExists:
          path: spec.template.spec.volumes
        template: templates/mailhog/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
        template: templates/mailhog/deployment.yaml

  - it: switches to maildir on a PVC when persistence is enabled
    set:
      mailhog.enabled: true
      mailhog.persistence.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: MH_STORAGE, value: maildir }
        template: templates/mailhog/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: MH_MAILDIR_PATH, value: /maildir }
        template: templates/mailhog/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: maildir
            persistentVolumeClaim:
              claimName: mailhog-maildir
        template: templates/mailhog/deployment.yaml
      - equal:
          path: metadata.name
          value: mailhog-maildir
        template: templates/mailhog/pvc.yaml
      - equal:
          path: spec.storageClassName
          value: local-path
        template: templates/mailhog/pvc.yaml
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
        template: templates/mailhog/pvc.yaml

  - it: uses Recreate so a rollout never contends for the RWO maildir volume
    set:
      mailhog.enabled: true
      mailhog.persistence.enabled: true
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
        template: templates/mailhog/deployment.yaml

  # --- UI auth -------------------------------------------------------------

  - it: leaves the UI unauthenticated when no auth is configured
    set:
      mailhog.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: MH_AUTH_FILE, value: /etc/mailhog/auth/MH_AUTH_FILE }
        template: templates/mailhog/deployment.yaml

  - it: renders an inline htpasswd into a chart-managed Secret and mounts it
    set:
      mailhog.enabled: true
      mailhog.ui.auth.htpasswd: "admin:$2a$04$abcdefghijklmnopqrstuv"
    asserts:
      - equal:
          path: metadata.name
          value: mailhog-ui-auth
        template: templates/mailhog/secret-ui-auth.yaml
      - matchRegex:
          path: stringData.MH_AUTH_FILE
          pattern: ^admin:\$2a\$04\$abcdefghijklmnopqrstuv\n?$
        template: templates/mailhog/secret-ui-auth.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: MH_AUTH_FILE, value: /etc/mailhog/auth/MH_AUTH_FILE }
        template: templates/mailhog/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ui-auth
            secret:
              secretName: mailhog-ui-auth
              items:
                - key: MH_AUTH_FILE
                  path: MH_AUTH_FILE
        template: templates/mailhog/deployment.yaml
      - exists:
          path: spec.template.metadata.annotations["checksum/ui-auth"]
        template: templates/mailhog/deployment.yaml

  - it: mounts an externally-managed auth Secret and renders no Secret of its own
    set:
      mailhog.enabled: true
      mailhog.ui.auth.existingSecret.name: mailhog-auth
      mailhog.ui.auth.existingSecret.key: auth-file
    asserts:
      - hasDocuments: { count: 0 }
        template: templates/mailhog/secret-ui-auth.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: MH_AUTH_FILE, value: /etc/mailhog/auth/auth-file }
        template: templates/mailhog/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ui-auth
            secret:
              secretName: mailhog-auth
              items:
                - key: auth-file
                  path: auth-file
        template: templates/mailhog/deployment.yaml
      - notExists:
          path: spec.template.metadata.annotations["checksum/ui-auth"]
        template: templates/mailhog/deployment.yaml

  - it: refuses both inline and external auth sources
    set:
      mailhog.enabled: true
      mailhog.ui.auth.htpasswd: "admin:$2a$04$abc"
      mailhog.ui.auth.existingSecret.name: mailhog-auth
      mailhog.ui.auth.existingSecret.key: auth-file
    asserts:
      - failedTemplate:
          errorMessage: "Set either mailhog.ui.auth.htpasswd (inline) or mailhog.ui.auth.existingSecret.name (external), not both"
        template: templates/mailhog/deployment.yaml

  - it: requires existingSecret.key alongside existingSecret.name
    set:
      mailhog.enabled: true
      mailhog.ui.auth.existingSecret.name: mailhog-auth
    asserts:
      - failedTemplate:
          errorMessage: "mailhog.ui.auth.existingSecret.key is required when existingSecret.name is set"
        template: templates/mailhog/deployment.yaml

  # --- ingress -------------------------------------------------------------

  - it: renders the UI ingress against the http Service port
    set:
      mailhog.enabled: true
      mailhog.ui.ingress.enabled: true
      mailhog.ui.ingress.hostname: mail.example.com
    asserts:
      - hasDocuments: { count: 1 }
        template: templates/mailhog/ingress.yaml
      - equal:
          path: spec.ingressClassName
          value: traefik
        template: templates/mailhog/ingress.yaml
      - equal:
          path: spec.rules[0].host
          value: mail.example.com
        template: templates/mailhog/ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: mailhog
        template: templates/mailhog/ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8025
        template: templates/mailhog/ingress.yaml
      - notExists:
          path: spec.tls
        template: templates/mailhog/ingress.yaml

  - it: fails closed when the ingress is enabled without a hostname
    set:
      mailhog.enabled: true
      mailhog.ui.ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "mailhog.ui.ingress.hostname is required when mailhog.ui.ingress.enabled is true"
        template: templates/mailhog/ingress.yaml

  - it: passes spec.tls through verbatim
    set:
      mailhog.enabled: true
      mailhog.ui.ingress.enabled: true
      mailhog.ui.ingress.hostname: mail.example.com
      mailhog.ui.ingress.tls:
        - hosts: [mail.example.com]
          secretName: mail-tls
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: mail-tls
        template: templates/mailhog/ingress.yaml

  - it: merges commonAnnotations with the ingress' own, the specific one winning
    set:
      mailhog.enabled: true
      mailhog.ui.ingress.enabled: true
      mailhog.ui.ingress.hostname: mail.example.com
      mailhog.commonAnnotations:
        argocd.argoproj.io/sync-wave: "-1"
        shared: from-common
      mailhog.ui.ingress.annotations:
        traefik.ingress.kubernetes.io/router.middlewares: alpha-3-basic-auth@kubernetescrd
        shared: from-ingress
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        template: templates/mailhog/ingress.yaml
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: alpha-3-basic-auth@kubernetescrd
        template: templates/mailhog/ingress.yaml
      - equal:
          path: metadata.annotations.shared
          value: from-ingress
        template: templates/mailhog/ingress.yaml

  # --- labels, annotations, hardening --------------------------------------

  - it: labels every resource component=resources for the deployment-metadata standard
    set:
      mailhog.enabled: true
      mailhog.persistence.enabled: true
      mailhog.ui.ingress.enabled: true
      mailhog.ui.ingress.hostname: mail.example.com
    asserts:
      - equal:
          path: metadata.labels["app.togglecorp.com/component"]
          value: resources
        template: templates/mailhog/ingress.yaml
      - equal:
          path: metadata.labels["app.togglecorp.com/component"]
          value: resources
        template: templates/mailhog/deployment.yaml
      - equal:
          path: metadata.labels["app.togglecorp.com/component"]
          value: resources
        template: templates/mailhog/pvc.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mail-catcher
        template: templates/mailhog/service.yaml

  - it: deep-merges the deploy layer's taxonomy with the chart's component label
    set:
      mailhog.enabled: true
      mailhog.commonLabels:
        app.togglecorp.com/part-of: Mapswipe
        app.togglecorp.com/instance: "1"
    asserts:
      - equal:
          path: metadata.labels["app.togglecorp.com/part-of"]
          value: Mapswipe
        template: templates/mailhog/deployment.yaml
      - equal:
          path: metadata.labels["app.togglecorp.com/instance"]
          value: "1"
        template: templates/mailhog/deployment.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mail-catcher
        template: templates/mailhog/deployment.yaml

  - it: keeps commonLabels out of the immutable selector
    set:
      mailhog.enabled: true
      mailhog.commonLabels:
        app.togglecorp.com/part-of: Mapswipe
    asserts:
      - notExists:
          path: spec.selector.matchLabels["app.togglecorp.com/part-of"]
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: mailhog
            app.kubernetes.io/instance: my-release
        template: templates/mailhog/deployment.yaml

  - it: keeps the chart version off the pod template so a bump does not roll it
    set:
      mailhog.enabled: true
    asserts:
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
        template: templates/mailhog/deployment.yaml

  - it: applies commonAnnotations to every resource
    set:
      mailhog.enabled: true
      mailhog.persistence.enabled: true
      mailhog.commonAnnotations:
        argocd.argoproj.io/sync-wave: "-1"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        template: templates/mailhog/deployment.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        template: templates/mailhog/service.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        template: templates/mailhog/pvc.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        template: templates/mailhog/secret.yaml

  - it: satisfies the restricted Pod Security Standard
    set:
      mailhog.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        template: templates/mailhog/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
        template: templates/mailhog/deployment.yaml

  - it: probes the UI port over TCP, which survives MH_AUTH_FILE returning 401
    set:
      mailhog.enabled: true
      mailhog.ui.auth.htpasswd: "admin:$2a$04$abc"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http
        template: templates/mailhog/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
        template: templates/mailhog/deployment.yaml

  - it: pins image, EHLO hostname, scheduling and resources from values
    set:
      mailhog.enabled: true
      mailhog.image.tag: v1.0.2
      mailhog.hostname: mail.alpha-3.internal
      mailhog.nodeSelector: { disktype: ssd }
      mailhog.tolerations:
        - key: dedicated
          operator: Equal
          value: mail
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mailhog/mailhog:v1.0.2
        template: templates/mailhog/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: MH_HOSTNAME, value: mail.alpha-3.internal }
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
        template: templates/mailhog/deployment.yaml
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: node.kubernetes.io/disk-raid
        template: templates/mailhog/deployment.yaml
