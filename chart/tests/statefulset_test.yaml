suite: statefulset
templates:
  - tcpg/postgres.yaml
  - tcpg/secrets.yaml
  - tcpg/configmap.yaml
release:
  name: my-release
tests:
  - it: is a single-replica StatefulSet
    template: tcpg/postgres.yaml
    asserts:
      - isKind: { of: StatefulSet }
      - equal: { path: spec.replicas, value: 1 }
      - equal: { path: spec.serviceName, value: my-release-tcpg }

  - it: has hardened pod securityContext
    template: tcpg/postgres.yaml
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 999 }
      - equal: { path: spec.template.spec.securityContext.runAsGroup, value: 999 }
      - equal: { path: spec.template.spec.securityContext.fsGroup, value: 999 }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }

  - it: main container meets restricted PSS
    template: tcpg/postgres.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: tmp, mountPath: /tmp }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: run-postgresql, mountPath: /var/run/postgresql }
      - contains:
          path: spec.template.spec.volumes
          content: { name: tmp, emptyDir: {} }
      - contains:
          path: spec.template.spec.volumes
          content: { name: run-postgresql, emptyDir: {} }

  - it: init container meets restricted PSS
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          value: [ALL]
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content: { name: tmp, mountPath: /tmp }

  - it: sets PGDATA to a subdirectory
    template: tcpg/postgres.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGDATA
            value: /var/lib/postgresql/data/pgdata

  - it: wires envFrom to the credentials secret
    template: tcpg/postgres.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-release-tcpg-pg-credential

  - it: main container envFrom does not reference the load-credential secret (no DUMP_AUTH_VALUE leak)
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.auth.dumpAuth.type: basic
      tcpg.auth.dumpAuth.value: user:pw
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          any: true
          content:
            secretRef:
              name: my-release-tcpg-load-credential
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: { name: DUMP_AUTH_VALUE }

  - it: omits initContainer, command override, and restore mounts when no dumpPath
    template: tcpg/postgres.yaml
    asserts:
      - isNull: { path: spec.template.spec.initContainers }
      - isNull: { path: 'spec.template.spec.containers[0].command' }
      - isNull: { path: 'spec.template.spec.containers[0].args' }
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: entrypoint-wrapper
            mountPath: /etc/postgres-wrapper
            readOnly: true
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: dump

  - it: adds curl initContainer with no-auth case when dumpAuth.type is none
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: download-dump
      - matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: '^curlimages/curl:'
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: DUMP_BASE_URL, value: https://example.com }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: DUMP_PATH, value: /d.dump }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: DUMP_AUTH_TYPE, value: none }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: DUMP_INSECURE_SKIP_TLS_VERIFY, value: "false" }
      - notContains:
          path: spec.template.spec.initContainers[0].env
          any: true
          content: { name: DUMP_AUTH_VALUE }
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'case "\$DUMP_AUTH_TYPE"'

  - it: sets DUMP_INSECURE_SKIP_TLS_VERIFY to true when configured
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://self-signed.example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.auth.dumpInsecureSkipTlsVerify: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: DUMP_INSECURE_SKIP_TLS_VERIFY, value: "true" }

  - it: defaults DUMP_INSECURE_SKIP_TLS_VERIFY to false
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: DUMP_INSECURE_SKIP_TLS_VERIFY, value: "false" }

  - it: wires DUMP_AUTH_VALUE from chart-managed secret for basic auth
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.auth.dumpAuth.type: basic
      tcpg.auth.dumpAuth.value: user:pw
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: DUMP_AUTH_TYPE, value: basic }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DUMP_AUTH_VALUE
            valueFrom:
              secretKeyRef:
                name: my-release-tcpg-load-credential
                key: DUMP_AUTH_VALUE

  - it: wires DUMP_AUTH_VALUE from externally-managed secret when configured
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.auth.dumpAuth.type: bearer
      tcpg.auth.existingDumpAuthSecret.name: external-dump-auth
      tcpg.auth.existingDumpAuthSecret.key: my-token-key
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: DUMP_AUTH_TYPE, value: bearer }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DUMP_AUTH_VALUE
            valueFrom:
              secretKeyRef:
                name: external-dump-auth
                key: my-token-key

  - it: fails when dumpAuth.type is invalid
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.auth.dumpAuth.type: oauth
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.auth.dumpAuth.type must be one of: none, basic, bearer"

  - it: fails when basic/bearer is set without a value source
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.auth.dumpAuth.type: basic
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.auth.dumpAuth.type is basic/bearer but no value source is configured; provide tcpg.auth.dumpAuth.value or tcpg.auth.existingDumpAuthSecret.name"

  - it: fails when both inline and external auth value sources are set
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.auth.dumpAuth.type: basic
      tcpg.auth.dumpAuth.value: user:pw
      tcpg.auth.existingDumpAuthSecret.name: external-dump-auth
    asserts:
      - failedTemplate:
          errorMessage: "Set either tcpg.auth.dumpAuth.value (inline) or tcpg.auth.existingDumpAuthSecret.name (external), not both"

  - it: fails when dumpPath is set but dumpBaseUrl is empty
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpPath: /d.dump
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.auth.dumpBaseUrl is required when tcpg.auth.dumpPath is set"

  - it: fails when existingDumpAuthSecret.name is set but dumpAuth.type is none
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
      tcpg.auth.existingDumpAuthSecret.name: external-dump-auth
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.auth.existingDumpAuthSecret.name is set but tcpg.auth.dumpAuth.type is 'none'; set type to basic/bearer or clear existingDumpAuthSecret.name"

  - it: fails when dumpBaseUrl and dumpPath would produce a double slash
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com/
      tcpg.auth.dumpPath: /d.dump
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.auth.dumpBaseUrl ends with '/' and tcpg.auth.dumpPath starts with '/' — would produce '//' in URL; remove one"

  - it: fails when dumpBaseUrl and dumpPath have no slash between them
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: d.dump
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.auth.dumpBaseUrl and tcpg.auth.dumpPath have no slash between them; add trailing '/' to dumpBaseUrl or leading '/' to dumpPath"

  - it: accepts trailing slash on dumpBaseUrl without leading slash on dumpPath
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com/
      tcpg.auth.dumpPath: d.dump
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: download-dump

  - it: overrides command to entrypoint wrapper when dumpPath is set
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/sh
            - /etc/postgres-wrapper/entrypoint-wrapper.sh
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - postgres

  - it: mounts dump, restore-script, and wrapper when dumpPath is set
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: dump, mountPath: /dump }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: restore-script, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: entrypoint-wrapper, mountPath: /etc/postgres-wrapper, readOnly: true }

  - it: uses PVC volume by default and emptyDir when persistence disabled
    template: tcpg/postgres.yaml
    set:
      tcpg.persistence.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: pg-data
      - isNotNull:
          path: spec.template.spec.volumes[0].emptyDir
      - isNull:
          path: spec.template.spec.volumes[0].persistentVolumeClaim

  - it: includes secret checksum annotation
    template: tcpg/postgres.yaml
    asserts:
      - exists:
          path: 'spec.template.metadata.annotations["checksum/secret"]'

  - it: includes restore-script checksum annotation only when dumpPath is set
    template: tcpg/postgres.yaml
    set:
      tcpg.auth.dumpBaseUrl: https://example.com
      tcpg.auth.dumpPath: /d.dump
    asserts:
      - exists:
          path: 'spec.template.metadata.annotations["checksum/restore-script"]'

  - it: omits affinity, tolerations, and nodeSelector by default
    template: tcpg/postgres.yaml
    asserts:
      - notExists: { path: spec.template.spec.affinity }
      - notExists: { path: spec.template.spec.tolerations }
      - notExists: { path: spec.template.spec.nodeSelector }

  - it: renders affinity when set
    template: tcpg/postgres.yaml
    set:
      tcpg.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: [linux]
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/os

  - it: renders tolerations when set
    template: tcpg/postgres.yaml
    set:
      tcpg.tolerations:
        - key: dedicated
          operator: Equal
          value: db
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: db
            effect: NoSchedule

  - it: renders nodeSelector when set
    template: tcpg/postgres.yaml
    set:
      tcpg.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
