suite: statefulset
templates:
  - tcpg/postgres.yaml
  - tcpg/secrets.yaml
  - tcpg/configmap.yaml
set:
  tcpg.enabled: true
release:
  name: my-release
tests:
  - it: is a single-replica StatefulSet
    template: tcpg/postgres.yaml
    asserts:
      - isKind: { of: StatefulSet }
      - equal: { path: spec.replicas, value: 1 }
      - equal: { path: spec.serviceName, value: tcpg }

  - it: has hardened pod securityContext
    template: tcpg/postgres.yaml
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 999 }
      - equal: { path: spec.template.spec.securityContext.runAsGroup, value: 999 }
      - equal: { path: spec.template.spec.securityContext.fsGroup, value: 999 }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }

  - it: main container meets restricted PSS
    template: tcpg/postgres.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: tmp, mountPath: /tmp }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: run-postgresql, mountPath: /var/run/postgresql }
      - contains:
          path: spec.template.spec.volumes
          content: { name: tmp, emptyDir: { sizeLimit: 64Mi } }
      - contains:
          path: spec.template.spec.volumes
          content: { name: run-postgresql, emptyDir: { sizeLimit: 16Mi } }

  - it: init container meets restricted PSS
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          value: [ALL]
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content: { name: tmp, mountPath: /tmp }

  - it: sets PGDATA to a subdirectory
    template: tcpg/postgres.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGDATA
            value: /var/lib/postgresql/data/pgdata

  - it: wires envFrom to the credentials secret
    template: tcpg/postgres.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: tcpg-pg-credential

  - it: main container envFrom does not reference the restore-credential secret (no RESTORE_AUTH_VALUE leak)
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.value: user:pw
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          any: true
          content:
            secretRef:
              name: tcpg-restore-credential
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: { name: RESTORE_AUTH_VALUE }

  - it: omits initContainer, command override, and restore mounts when restore is disabled
    template: tcpg/postgres.yaml
    asserts:
      - isNull: { path: spec.template.spec.initContainers }
      - isNull: { path: 'spec.template.spec.containers[0].command' }
      # `args` is always rendered — it carries the Postgres parameters, and with
      # no command override the image entrypoint receives `postgres -c ...`.
      # See tests/tuning_test.yaml.
      - equal: { path: 'spec.template.spec.containers[0].args[0]', value: postgres }
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: entrypoint-wrapper
            mountPath: /etc/postgres-wrapper
            readOnly: true
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: restore

  - it: renders no restore artifacts when restore.enabled is false even with other fields set
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: false
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.value: user:pw
    asserts:
      - isNull: { path: spec.template.spec.initContainers }
      - isNull: { path: 'spec.template.spec.containers[0].command' }
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: restore
      - notExists:
          path: 'spec.template.metadata.annotations["checksum/restore-script"]'

  - it: adds curl initContainer with no-auth case when restore.auth.type is none
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: download-dump
      - matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: '^curlimages/curl:'
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: RESTORE_BASE_URL, value: https://example.com }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: RESTORE_PATH, value: /d.dump }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: RESTORE_AUTH_TYPE, value: none }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: RESTORE_INSECURE_SKIP_TLS_VERIFY, value: "false" }
      - notContains:
          path: spec.template.spec.initContainers[0].env
          any: true
          content: { name: RESTORE_AUTH_VALUE }
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'case "\$RESTORE_AUTH_TYPE"'

  - it: sets RESTORE_INSECURE_SKIP_TLS_VERIFY to true when configured
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://self-signed.example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.insecureSkipTlsVerify: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: RESTORE_INSECURE_SKIP_TLS_VERIFY, value: "true" }

  - it: defaults RESTORE_INSECURE_SKIP_TLS_VERIFY to false
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: RESTORE_INSECURE_SKIP_TLS_VERIFY, value: "false" }

  - it: wires RESTORE_AUTH_VALUE from chart-managed secret for basic auth
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.value: user:pw
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: RESTORE_AUTH_TYPE, value: basic }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: RESTORE_AUTH_VALUE
            valueFrom:
              secretKeyRef:
                name: tcpg-restore-credential
                key: RESTORE_AUTH_VALUE

  - it: wires RESTORE_AUTH_VALUE from externally-managed secret when configured
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.auth.type: bearer
      tcpg.init.restore.auth.existingSecret.name: external-restore-auth
      tcpg.init.restore.auth.existingSecret.key: my-token-key
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: RESTORE_AUTH_TYPE, value: bearer }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: RESTORE_AUTH_VALUE
            valueFrom:
              secretKeyRef:
                name: external-restore-auth
                key: my-token-key

  - it: fails when restore.auth.type is invalid
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.auth.type: oauth
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.restore.auth.type must be one of: none, basic, bearer"

  - it: fails when basic/bearer is set without a value source
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.auth.type: basic
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.restore.auth.type is basic/bearer but no value source is configured; provide tcpg.init.restore.auth.value or tcpg.init.restore.auth.existingSecret.name"

  - it: fails when both inline and external auth value sources are set
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.auth.type: basic
      tcpg.init.restore.auth.value: user:pw
      tcpg.init.restore.auth.existingSecret.name: external-restore-auth
      tcpg.init.restore.auth.existingSecret.key: RESTORE_AUTH_VALUE
    asserts:
      - failedTemplate:
          errorMessage: "Set either tcpg.init.restore.auth.value (inline) or tcpg.init.restore.auth.existingSecret.name (external), not both"

  - it: fails when existingSecret.name is set but existingSecret.key is empty
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.auth.type: bearer
      tcpg.init.restore.auth.existingSecret.name: external-restore-auth
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.restore.auth.existingSecret.key is required when existingSecret.name is set"

  - it: fails when restore.enabled but restore.path is empty
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.restore.path is required when tcpg.init.restore.enabled is true"

  - it: fails when restore.enabled but restore.baseUrl is empty
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.path: /d.dump
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.restore.baseUrl is required when tcpg.init.restore.enabled is true"

  - it: fails when existingSecret.name is set but restore.auth.type is none
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.auth.existingSecret.name: external-restore-auth
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.restore.auth.existingSecret.name is set but tcpg.init.restore.auth.type is 'none'; set type to basic/bearer or clear existingSecret.name"

  - it: fails when restore.baseUrl and restore.path would produce a double slash
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com/
      tcpg.init.restore.path: /d.dump
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.restore.baseUrl ends with '/' and tcpg.init.restore.path starts with '/' — would produce '//' in URL; remove one"

  - it: fails when restore.baseUrl and restore.path have no slash between them
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: d.dump
    asserts:
      - failedTemplate:
          errorMessage: "tcpg.init.restore.baseUrl and tcpg.init.restore.path have no slash between them; add trailing '/' to restore.baseUrl or leading '/' to restore.path"

  - it: accepts trailing slash on restore.baseUrl without leading slash on restore.path
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com/
      tcpg.init.restore.path: d.dump
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: download-dump

  - it: overrides command to entrypoint wrapper when restore is enabled
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /bin/sh
            - /etc/postgres-wrapper/entrypoint-wrapper.sh
      # The wrapper execs `docker-entrypoint.sh "$@"`, so the Postgres
      # parameters follow `postgres` in args. See tests/tuning_test.yaml.
      - equal: { path: 'spec.template.spec.containers[0].args[0]', value: postgres }

  - it: mounts restore, restore-script, and wrapper when restore is enabled
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: restore, mountPath: /restore }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: restore-script, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: entrypoint-wrapper, mountPath: /etc/postgres-wrapper, readOnly: true }
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content: { name: restore, mountPath: /restore }

  - it: uses PVC volume by default and emptyDir when persistence disabled
    template: tcpg/postgres.yaml
    set:
      tcpg.persistence.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: pg-data
      - isNotNull:
          path: spec.template.spec.volumes[0].emptyDir
      - isNull:
          path: spec.template.spec.volumes[0].persistentVolumeClaim

  - it: includes secret checksum annotation
    template: tcpg/postgres.yaml
    asserts:
      - exists:
          path: 'spec.template.metadata.annotations["checksum/secret"]'

  - it: includes restore-script checksum annotation only when restore is enabled
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
    asserts:
      - exists:
          path: 'spec.template.metadata.annotations["checksum/restore-script"]'

  - it: renders the RAID nodeAffinity by default and omits tolerations and nodeSelector
    template: tcpg/postgres.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: node.kubernetes.io/disk-raid
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].operator
          value: NotIn
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values
          value: ["true"]
      - notExists: { path: spec.template.spec.tolerations }
      - notExists: { path: spec.template.spec.nodeSelector }

  - it: renders affinity when set
    template: tcpg/postgres.yaml
    set:
      tcpg.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: [linux]
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/os

  - it: renders tolerations when set
    template: tcpg/postgres.yaml
    set:
      tcpg.tolerations:
        - key: dedicated
          operator: Equal
          value: db
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: db
            effect: NoSchedule

  - it: populates container resources by default
    template: tcpg/postgres.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi

  # --- ephemeral storage -----------------------------------------------------
  # An emptyDir with no sizeLimit grows until the node's disk is full, and the
  # kubelet then evicts pods under DiskPressure — including unrelated ones. The
  # volumes are bounded individually and summed into ephemeral-storage so the
  # kubelet charges this pod.

  - it: derives ephemeral-storage from the bounded volumes plus overhead
    template: tcpg/postgres.yaml
    asserts:
      # tmp 64 + socket 16 + overhead 512
      - equal:
          path: 'spec.template.spec.containers[0].resources.limits["ephemeral-storage"]'
          value: 592Mi
      - equal:
          path: 'spec.template.spec.containers[0].resources.requests["ephemeral-storage"]'
          value: 512Mi

  - it: includes the dump volume in the ephemeral-storage limit when restore is enabled
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
    asserts:
      # 64 + 16 + 512 + 8Gi
      - equal:
          path: 'spec.template.spec.containers[0].resources.limits["ephemeral-storage"]'
          value: 8784Mi
      - contains:
          path: spec.template.spec.volumes
          content: { name: restore, emptyDir: { sizeLimit: 8Gi } }

  - it: sizes the dump volume and the limit from init.restore.diskSize
    template: tcpg/postgres.yaml
    set:
      tcpg.init.restore.enabled: true
      tcpg.init.restore.baseUrl: https://example.com
      tcpg.init.restore.path: /d.dump
      tcpg.init.restore.diskSize: 32Gi
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: restore, emptyDir: { sizeLimit: 32Gi } }
      - equal:
          path: 'spec.template.spec.containers[0].resources.limits["ephemeral-storage"]'
          value: 33360Mi

  # Without a PVC the whole database is node ephemeral storage, so it has to be
  # bounded and inside the limit too.
  - it: bounds the pg-data emptyDir and budgets it when persistence is disabled
    template: tcpg/postgres.yaml
    set:
      tcpg.persistence.enabled: false
      tcpg.persistence.size: 4Gi
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].emptyDir.sizeLimit
          value: 4Gi
      # 64 + 16 + 512 + 4Gi
      - equal:
          path: 'spec.template.spec.containers[0].resources.limits["ephemeral-storage"]'
          value: 4688Mi

  - it: honours explicit ephemeral-storage in resources over the derived value
    template: tcpg/postgres.yaml
    set:
      tcpg.resources.limits.ephemeral-storage: 20Gi
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].resources.limits["ephemeral-storage"]'
          value: 20Gi
      # the request is still derived
      - equal:
          path: 'spec.template.spec.containers[0].resources.requests["ephemeral-storage"]'
          value: 512Mi

  - it: keeps the volume sizeLimits but sets no resource when ephemeralStorage is off
    template: tcpg/postgres.yaml
    set:
      tcpg.ephemeralStorage.enabled: false
    asserts:
      - notExists:
          path: 'spec.template.spec.containers[0].resources.limits["ephemeral-storage"]'
      - notExists:
          path: 'spec.template.spec.containers[0].resources.requests["ephemeral-storage"]'
      - contains:
          path: spec.template.spec.volumes
          content: { name: tmp, emptyDir: { sizeLimit: 64Mi } }

  - it: scales the limit with the configured volume sizes
    template: tcpg/postgres.yaml
    set:
      tcpg.ephemeralStorage.tmp: 1Gi
      tcpg.ephemeralStorage.socket: 32Mi
      tcpg.ephemeralStorage.overhead: 256Mi
    asserts:
      - equal:
          path: 'spec.template.spec.containers[0].resources.limits["ephemeral-storage"]'
          value: 1312Mi
      - equal:
          path: 'spec.template.spec.containers[0].resources.requests["ephemeral-storage"]'
          value: 256Mi
      - contains:
          path: spec.template.spec.volumes
          content: { name: tmp, emptyDir: { sizeLimit: 1Gi } }

  - it: renders nodeSelector when set
    template: tcpg/postgres.yaml
    set:
      tcpg.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
