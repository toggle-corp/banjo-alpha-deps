suite: secret-bootstrap RBAC
# Shared RBAC for the credential-bootstrap Helm-hook Jobs. One ServiceAccount +
# Role + RoleBinding, created at hook weight -5 (before the Jobs at weight 0),
# gated on either tcpg OR minio being enabled. The Role can `create` secrets
# cluster-resource-wide (create cannot be resourceName-scoped) and
# get/update/patch only the two named credential Secrets.
templates:
  - secret-bootstrap-rbac.yaml
release:
  name: my-release
tests:
  - it: renders SA + Role + RoleBinding when tcpg is enabled
    set:
      tcpg.enabled: true
    asserts:
      - hasDocuments: { count: 3 }
      - documentIndex: 0
        isKind: { of: ServiceAccount }
      - documentIndex: 1
        isKind: { of: Role }
      - documentIndex: 2
        isKind: { of: RoleBinding }

  - it: renders RBAC when only minio is enabled
    set:
      tcpg.enabled: false
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    asserts:
      - hasDocuments: { count: 3 }

  - it: renders nothing when both tcpg and minio are disabled
    set:
      tcpg.enabled: false
      minio.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: all three resources carry the hook annotations at weight -5
    set:
      tcpg.enabled: true
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/hook"]'
          value: pre-install,pre-upgrade
        documentIndex: 0
      - equal:
          path: 'metadata.annotations["helm.sh/hook-weight"]'
          value: "-5"
        documentIndex: 0
      - equal:
          path: 'metadata.annotations["helm.sh/hook-delete-policy"]'
          value: before-hook-creation
        documentIndex: 0
      - equal:
          path: 'metadata.annotations["helm.sh/hook-weight"]'
          value: "-5"
        documentIndex: 1
      - equal:
          path: 'metadata.annotations["helm.sh/hook-weight"]'
          value: "-5"
        documentIndex: 2

  - it: Role allows create on secrets and scopes get/update/patch to the two names
    set:
      tcpg.enabled: true
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    documentIndex: 1
    asserts:
      # create rule — cannot be resourceNames-scoped
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create"]
      # get/update/patch scoped to both credential names
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "update", "patch"]
            resourceNames: ["tcpg-pg-credential", "minio-s3-credential"]

  - it: resourceNames includes only the tcpg secret when minio is disabled
    set:
      tcpg.enabled: true
      minio.enabled: false
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "update", "patch"]
            resourceNames: ["tcpg-pg-credential"]

  - it: resourceNames includes only the minio secret when tcpg is disabled
    set:
      tcpg.enabled: false
      minio.enabled: true
      minio.ingress.enabled: true
      minio.ingress.hostname: s3.example.com
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "update", "patch"]
            resourceNames: ["minio-s3-credential"]

  - it: RoleBinding ties the Role to the shared ServiceAccount
    set:
      tcpg.enabled: true
    asserts:
      - documentIndex: 2
        equal:
          path: roleRef.name
          value: my-release-secret-bootstrap
      - documentIndex: 2
        equal:
          path: subjects[0].name
          value: my-release-secret-bootstrap
      - documentIndex: 0
        equal:
          path: metadata.name
          value: my-release-secret-bootstrap

  - it: honors the tcpg.secretName override in the Role resourceNames
    set:
      tcpg.enabled: true
      minio.enabled: false
      tcpg.secretName: my-custom-pg-secret
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "update", "patch"]
            resourceNames: ["my-custom-pg-secret"]
