suite: service
templates:
  - service.yaml
tests:
  - it: renders ClusterIP service on port 5432 by default
    asserts:
      - isKind: { of: Service }
      - equal: { path: spec.type, value: ClusterIP }
      - equal: { path: 'spec.ports[0].port', value: 5432 }
      - equal: { path: 'spec.ports[0].targetPort', value: postgres }
      - equal: { path: 'spec.ports[0].name', value: postgres }
      - equal: { path: 'spec.ports[0].protocol', value: TCP }

  - it: respects service.type and service.port overrides
    set:
      service.type: NodePort
      service.port: 15432
    asserts:
      - equal: { path: spec.type, value: NodePort }
      - equal: { path: 'spec.ports[0].port', value: 15432 }
