tcpg:
  enabled: false

  # Stable name → predictable Service DNS: `tcpg.<namespace>.svc.cluster.local`.
  # Fixed name → resources are `tcpg-*` instead of `<release>-tcpg-*`.
  fullnameOverride: "tcpg"

  # Override the name of the Postgres credential Secret. Empty → computed default
  # `<fullname>-pg-credential` (i.e. `tcpg-pg-credential` with the override above).
  # The bootstrap Job (below) creates/manages a Secret by this name; the app and
  # StatefulSet consume it by the same name.
  secretName: ""

  image:
    repository: postgres
    tag: "18.1"
    pullPolicy: IfNotPresent
    pullSecrets: []

  initImage:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent

  # Memory request == limit (1Gi), so the full 1Gi is reserved on the node and
  # Postgres cannot be squeezed by neighbours. CPU is deliberately burstable
  # (0.1 → 2 cores) for dump restore / ad-hoc queries, which means the pod is in
  # the *Burstable* QoS class, not Guaranteed — Guaranteed would require the CPU
  # request to equal the limit too, reserving 2 full cores per instance.
  #
  # With `autoTune` on (below), `limits.memory` and `limits.cpu` are also the
  # inputs the chart sizes Postgres from, so raising a limit actually gives
  # Postgres more to work with — on the stock image, raising the limit alone
  # changes nothing, because shared_buffers stays at its 128MB default.
  resources:
    requests:
      cpu: 0.1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 1Gi

  # Size Postgres from `resources.limits` instead of leaving the image's stock
  # defaults, which are wrong for a container:
  #   - effective_cache_size defaults to 4GB regardless of the memory limit, so
  #     at 1Gi the planner is told it has 4x the cache that exists (under
  #     cgroup v2 the page cache is charged to the container).
  #   - max_connections defaults to 100 with no memory admission control. At a
  #     1Gi limit that is enough to OOM-kill the postmaster, which drops every
  #     session and crash-recovers the cluster.
  #   - worker counts are derived from the *node's* core count, because a CPU
  #     limit is a CFS quota and not a cpuset — Postgres sees 8–24 cores here
  #     and sizes 8 background workers against a 2-core quota.
  # Also turns on query observability (pg_stat_statements, slow-query and
  # lock-wait logging), which the stock config has none of.
  #
  # This is not a throughput knob: measured on a 704MB dataset, the memory and
  # planner values changed throughput neither way. It exists to make the
  # planner's model match reality and to bound memory.
  #
  # See docs/usages.md for the derivation and the exact defaults. Set to false
  # to keep Postgres' own defaults (this also disables the budget checks).
  autoTune: true

  # Postgres parameters, layered on top of the derived defaults (these win) and
  # passed as `-c key=value` container args. Any GUC is accepted.
  #
  # While `autoTune` is on, memory values must carry an explicit unit (kB/MB/GB)
  # so the chart can budget them against `resources.limits.memory` — a unit-less
  # Postgres value is ambiguous (8kB blocks for shared_buffers, kB for work_mem).
  # With `autoTune: false` there is no budget to check against, so values here
  # are passed through unvalidated.
  #
  # Changing a value here rolls the StatefulSet. Note that a bad parameter makes
  # Postgres exit with `FATAL: unrecognized configuration parameter`, so cover
  # changes with a unit test rather than discovering it in-cluster.
  #
  #   parameters:
  #     work_mem: 16MB          # budget-checked against max_connections
  #     log_min_duration_statement: 100ms
  parameters: {}

  # Extensions created in `init.database` by a post-install/post-upgrade Helm-hook
  # Job (templates/tcpg/extension-bootstrap-job.yaml). `CREATE EXTENSION` needs a
  # running server, so this hook runs *after* the StatefulSet exists — unlike the
  # credential bootstrap, which is pre-install. ArgoCD converts the Helm hook to
  # PostSync. Each name is applied with `IF NOT EXISTS`, so re-running is a no-op
  # and the Job is safe on every upgrade.
  #
  # This is the SOLE gate: an empty list renders no Job, no hook, nothing.
  #
  # Names are restricted at render time to letters, digits and underscore — they
  # are interpolated into SQL, and anything else fails the render. Creating an
  # extension needs superuser, which `init.username` is by default.
  #
  # `pg_stat_statements` is here because `autoTune` preloads the library but the
  # view still has to be created once per database. Keeping the two in sync is
  # checked at render time: listing it while it is absent from the effective
  # `shared_preload_libraries` (autoTune off, or overridden in `parameters`) fails
  # the render rather than failing the hook mid-release.
  extensions:
    - pg_stat_statements

  extensionBootstrap:
    # Helm does not wait for the StatefulSet to be Ready before running
    # post-install hooks, so the Job polls `pg_isready` itself. The default
    # covers a normal start; a first install with `init.restore.enabled` can take
    # far longer (the startupProbe allows 30 min), so raise this to match the
    # dump if the Job would otherwise give up before the restore finishes.
    waitTimeoutSeconds: 300
    # The wait loop above already absorbs a slow start, so retries only cover a
    # transient psql failure.
    backoffLimit: 3
    # Bounds the Job across ALL attempts, not per attempt — so it has to exceed
    # waitTimeoutSeconds, and raising one means raising the other.
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # `/dev/shm`, mounted as a Memory-medium emptyDir. Kubernetes defaults it to
  # 64Mi, which is too small for parallel query: workers build hash tables in
  # shared memory (`dynamic_shared_memory_type=posix`) and when it runs out the
  # query does not slow down, it fails —
  #   ERROR: could not resize shared memory segment ...: No space left on device
  #
  # A Memory-medium emptyDir counts against the container's memory limit, so
  # this size is part of the memory budget. While `autoTune` is on, the chart
  # fails to render if it is smaller than
  # `work_mem x (max_parallel_workers_per_gather + 1)`.
  shm:
    enabled: true
    size: 128Mi

  # Shutdown. Postgres reads SIGTERM as a *smart* shutdown — it waits for every
  # client to disconnect, indefinitely — and SIGINT as a fast shutdown. Getting
  # the smart one means the grace period expires, SIGKILL follows, and the data
  # directory crash-recovers on the next start.
  #
  # In practice the runtime already avoids that: the postgres image declares
  # `STOPSIGNAL SIGINT`, and containerd (kind, and Talos on the tc cluster)
  # honours it — measured in chart/tests/e2e, an un-hooked pod with a client
  # held in an open transaction still logged "received fast shutdown request"
  # and stopped in ~1s. The widely repeated claim that Kubernetes always sends
  # SIGTERM is not true on containerd.
  #
  # The preStop hook below is therefore defence in depth, not a fix for a live
  # bug. It is kept because the clean-shutdown path otherwise rests entirely on
  # a metadata field of whatever image `image.repository` points at: swap in a
  # Postgres image built without STOPSIGNAL and shutdown silently degrades to
  # smart. `pg_ctl -m fast stop` makes the behaviour explicit and image-
  # independent, and costs one sub-second exec per termination.
  #
  # The grace period is generous so a large shutdown checkpoint (up to
  # shared_buffers of dirty pages) is never truncated into a SIGKILL. The hook
  # gets this budget minus 20s, floored at 10s.
  terminationGracePeriodSeconds: 120

  # First-init only. These values seed the database the FIRST time it is
  # initialized: the credentials below seed the DB, and the dump/restore config
  # runs only at first init. After that, the live DB state in the PVC is what
  # matters — re-rendering this block does not re-seed an existing database.
  init:
    database: postgres
    username: postgres
    # Seeds the password ONLY at first init. A pre-install/pre-upgrade Helm-hook
    # Job (templates/tcpg/secret-bootstrap-job.yaml) bootstraps the
    # tcpg-pg-credential Secret against the LIVE cluster — GitOps-safe, no
    # `lookup`. Three-state logic at runtime:
    #   - set here       → write/overwrite the Secret with this password
    #   - empty + exists → preserve the existing Secret (no-op)
    #   - empty + absent → generate a random 32-char password once
    # The password is frozen into the PVC at first init and never re-read, so set
    # this explicitly only at first init or for a deliberate reset (must match the
    # PVC). The same value works identically under plain Helm and ArgoCD/Flux.
    password: ""
    # Optional one-shot restore on first init. The whole block is gated by
    # `restore.enabled` — when false, nothing restore-related renders (no init
    # container, no configmap, no restore-credential secret), regardless of the
    # other fields below.
    #
    # Effective URL is restore.baseUrl + restore.path, concatenated verbatim at
    # runtime. Both are non-secret (plain env vars, visible in the pod spec).
    # Authentication is handled separately via restore.auth below — do NOT embed
    # credentials in the URL.
    #
    # Supports plain .sql, .sql.gz, `pg_dump -Fc`.
    restore:
      enabled: false          # SOLE gate; whole block ignored when false
      baseUrl: ""             # e.g. https://example.com
      path: ""                # e.g. /dumps/prod/db.sql.gz
      # Skip TLS certificate verification for the download (curl -k). Use only
      # when the server presents a self-signed or internal-CA cert. Verify the
      # host out-of-band; this disables MITM protection for the download.
      insecureSkipTlsVerify: false
      # Auth for the download.
      #   type: none   — no auth header
      #   type: basic  — value is "user:pass", passed via curl -u
      #   type: bearer — value is the token, sent as Authorization: Bearer <value>
      # Only auth.value is secret. Either set it inline (stored in the chart-
      # managed Secret) OR reference an externally-managed Secret via
      # auth.existingSecret.{name,key}. The two are mutually exclusive — provide
      # exactly one when type != none.
      auth:
        type: none            # none | basic | bearer
        value: ""             # inline auth value ─┐ exactly one when type != none
        existingSecret:        # external secret ref ┘
          name: ""
          key: ""             # NO default — user must set it

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    # local-path uses the node's local disk via Rancher's local-path-provisioner.
    storageClass: "local-path"
    size: 1Gi  # NOTE: ignored by local-path (node disk is the real limit)
    accessModes:
      - ReadWriteOnce

  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # Applied to every container (init + main). Defaults satisfy the restricted
  # Pod Security Standard (PSS). The chart mounts emptyDirs at /tmp and (for the
  # main container) /var/run/postgresql and /dev/shm, so
  # readOnlyRootFilesystem: true is safe — Postgres writes only under $PGDATA,
  # the unix-socket dir, /tmp, and (for parallel-query shared memory) /dev/shm.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Single-replica DB → PDB blocks voluntary node drains. Off by default; enable
  # only if you'd rather have a stuck drain than an automated DB restart.
  podDisruptionBudget:
    enabled: false

  # Steer alpha databases off RAID nodes — RAID is reserved for prod. Alpha
  # workloads are disposable, so we leave the RAID pool for production-grade
  # services.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

  tolerations: []

  nodeSelector: {}

  # Annotations applied to every tcpg resource's metadata. Useful for Argo CD
  # sync-waves (argocd.argoproj.io/sync-wave) or Helm hooks (helm.sh/hook).
  # Does NOT propagate to the dragonfly/minio subcharts — use their own
  # annotation values if those charts support them.
  commonAnnotations: {}

# Dragonfly (Redis-compatible in-memory store). Pulled from the official OCI
# chart at ghcr.io/dragonflydb/dragonfly/helm (version pinned in Chart.yaml).
# Values are passed through to the subchart — see the upstream values for the
# full surface: https://github.com/dragonflydb/dragonfly/blob/main/contrib/charts/dragonfly/values.yaml
dragonfly:
  enabled: false
  # Stable name → Service DNS: `dragonfly.<namespace>.svc.cluster.local:6379`.
  fullnameOverride: "dragonfly"
  # Single-replica for alpha (no HA, no snapshot replication). Dragonfly has no
  # separate replicationFactor — `replicaCount: 1` is the only knob needed.
  replicaCount: 1
  resources:
    requests:
      cpu: 0.1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 1Gi
  storage:
    enabled: true
    storageClassName: "local-path"
    requests: 128Mi  # NOTE: ignored by local-path (node disk is the real limit)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

# MinIO (S3-compatible object store). Pulled from the Bitnami OCI chart at
# registry-1.docker.io/bitnamicharts/minio (version pinned in Chart.yaml).
# Values pass through to the subchart — see the upstream values for the full
# surface: https://github.com/bitnami/charts/blob/main/bitnami/minio/values.yaml
#
# NOTE: Bitnami restructured image distribution in Aug 2025 — the public
# `bitnami/*` repos went subscription-gated (Bitnami Secure Images). The chart
# still pins those repos as defaults, so a vanilla install will 401 on pull.
#
# We override every image the chart can pull to `bitnamilegacy/*` — a frozen
# free mirror of the pre-cutover images. Tags are inherited from the chart's
# own pinned defaults (the same tags exist on bitnamilegacy, so versions stay
# in lockstep with whatever Chart.yaml's `version:` was published with).
#
# Trade-off: `bitnamilegacy/*` is frozen — no future security patches. Fine
# for alpha. For production, set `image.repository: bitnami/<name>` (and the
# other three) back to bitnami and supply pull secrets for a Bitnami Secure
# Images subscription, or migrate off the Bitnami chart entirely.
#
# MinIO standalone for alpha. The topology below (standalone mode, WebUI off,
# Traefik ingress, single-node persistence) is baked in; a per-install overlay
# only supplies `minio.ingress.hostname` (the real S3 API host) and
# `minio.defaultBuckets`.
minio:
  enabled: false
  # Stable name → API DNS: `minio.<namespace>.svc.cluster.local:9000`.
  fullnameOverride: "minio"
  # Deployment-metadata standard (app.togglecorp.com/*): the deploy layer (argo-templates'
  # banjo-x) stamps part-of/name/stack/tier/instance here; `component: resources` is OURS
  # because only this chart knows these ingresses serve a dependency, not the app. Helm
  # deep-merges the two maps.
  #
  # Why commonLabels and not ingress.labels: the bitnami minio subchart exposes no
  # per-ingress labels value, so this is the only hook. It lands on ALL minio resources,
  # which is selector-SAFE: bitnami's `common.labels.matchLabels` picks only
  # app.kubernetes.io/{name,instance} out of customLabels, so arbitrary labels never
  # reach an immutable matchLabels selector.
  commonLabels:
    app.togglecorp.com/component: resources
  auth:
    # The parent chart generates this secret (see templates/minio/secret.yaml) and
    # MinIO reads its root creds back from it. Single source of truth: the secret
    # is NAMED after this value. App consumes the same secret via envFrom.
    existingSecret: minio-s3-credential
    rootUserSecretKey: S3_ACCESS_KEY_ID
    rootPasswordSecretKey: S3_SECRET_ACCESS_KEY
  image:
    repository: bitnamilegacy/minio
  clientImage:
    repository: bitnamilegacy/minio-client
  console:
    enabled: false
    image:
      repository: bitnamilegacy/minio-object-browser
  defaultInitContainers:
    volumePermissions:
      # Off by default upstream; pinned here so flipping `enabled: true` in an
      # overlay doesn't silently fall back to the gated bitnami/os-shell repo.
      image:
        repository: bitnamilegacy/os-shell
  disableWebUI: true
  mode: standalone
  ingress:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      # Per-request body cap (NOT a per-object limit), enforced by the Traefik
      # Middleware `minio-body-limit` (rendered by the parent chart from
      # minioConfig.maxRequestBodyBytes). Requires a Traefik ingress. The
      # `{{ .Release.Namespace }}` token below is left LITERAL on purpose — the
      # MinIO subchart resolves it via tpl at render time.
      traefik.ingress.kubernetes.io/router.middlewares: '{{ .Release.Namespace }}-minio-body-limit@kubernetescrd'
      # Deep health endpoint for external uptime monitoring (NOT a k8s probe path).
      # Chart-fixed: MinIO's liveness path is a property of MinIO, not of the install,
      # so no overlay should have to know it.
      app.togglecorp.com/health-check: /minio/health/live
  # Your per-install overlay MUST set `minio.ingress.hostname` to the real S3 API
  # host. The parent chart derives S3_ENDPOINT_URL from it (see
  # templates/minio/secret.yaml); rendering fails closed if it's left empty (or
  # set minioConfig.endpointUrl explicitly).
  defaultBuckets: ""
  provisioning:
    enabled: true
    resourcesPreset: "nano"
    cleanupAfterFinished:
      enabled: true
  resources:
    requests:
      cpu: 0.1
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1Gi
  global:
    defaultStorageClass: "local-path"
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 1Gi  # NOTE: ignored by local-path (node disk is the real limit)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

# Parent-chart-managed MinIO/S3 credentials. The chart renders a single Secret
# (templates/minio/secret.yaml, named after minio.auth.existingSecret) exposing
# S3_ENDPOINT_URL / S3_REGION / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY. The app
# binds it via envFrom; MinIO reads the access key / secret key back as its root
# user / password. One secret, no drift.
minioConfig:
  # Fixed access key id (like a username — not secret, not random). Becomes
  # S3_ACCESS_KEY_ID and MinIO's root user.
  accessKeyId: minio
  # Bootstrapped by the pre-install/pre-upgrade Helm-hook Job
  # (templates/minio/secret-bootstrap-job.yaml) against the LIVE cluster —
  # GitOps-safe, no `lookup`. Three-state logic at runtime:
  #   - set here       → write/overwrite the Secret with this key (rotation)
  #   - empty + exists → preserve the existing Secret (no-op)
  #   - empty + absent → generate a random 32-char key once
  # MinIO re-reads this on restart, so it is rotatable: set the value and restart
  # MinIO + consuming app pods. The same value works under plain Helm and GitOps.
  secretAccessKey: ""
  region: us-east-1
  endpointScheme: https
  # Explicit S3_ENDPOINT_URL override. Empty → derived as
  # "<endpointScheme>://<minio.ingress.hostname>". Set this for in-cluster svc
  # endpoints or non-ingress setups.
  endpointUrl: ""
  # Per-request body size cap (integer bytes) for the MinIO S3 ingress. Empty →
  # no Traefik Middleware is rendered. This is a PER-REQUEST cap, not a
  # per-object limit. Requires a Traefik ingress (the Middleware is a Traefik
  # CRD; wire it via the router.middlewares annotation on minio.ingress).
  maxRequestBodyBytes: 104857600  # 100 MiB — per-request cap
  # Bytes held in memory per in-flight request before spilling to disk (integer
  # bytes). Empty → omitted from the Middleware spec, so Traefik's 1 MiB default
  # applies. Only takes effect when maxRequestBodyBytes is set.
  memRequestBodyBytes: 52428800   # 50 MiB — held in memory before spilling to disk
# Mailpit (SMTP catcher). One per instance: the app points its SMTP client at
# `mailpit.<namespace>.svc.cluster.local:1025` and every message it sends is
# swallowed and shown in Mailpit's web UI instead of reaching a real inbox.
# Rendered in-tree from templates/mailpit/ (there is no official subchart).
mailpit:
  enabled: false

  # Stable name → SMTP DNS: `mailpit.<namespace>.svc.cluster.local:1025`.
  fullnameOverride: "mailpit"

  # Override the name of the consumer-facing SMTP config Secret. Empty →
  # computed default `<fullname>-smtp-config` (i.e. `mailpit-smtp-config`).
  secretName: ""

  image:
    repository: axllent/mailpit
    tag: "v1.30.7"   # pinned — verify a real existing tag before bumping
    pullPolicy: IfNotPresent
    pullSecrets: []

  # Shown in Mailpit's web UI to identify this instance (MP_LABEL). Empty → none.
  # Useful when several alpha instances are open in adjacent browser tabs.
  label: ""

  service:
    type: ClusterIP
    smtpPort: 1025
    httpPort: 8025

  smtp:
    # Accept ANY SMTP username/password, and also none. On by default because
    # apps generally send credentials whether or not the catcher wants them —
    # Django calls login() whenever EMAIL_HOST_USER is set, and stock Mailpit
    # does not advertise AUTH at all, so the send fails with
    # `SMTPNotSupportedError: SMTP AUTH extension not supported by server`.
    #
    # This also sets MP_SMTP_AUTH_ALLOW_INSECURE, which is mandatory rather than
    # optional: Mailpit exits 1 on startup if accept-any is set without it
    # ("authentication requires STARTTLS or TLS encryption"). The traffic is
    # in-cluster plaintext to a mail catcher, so there is nothing to protect.
    #
    # Set false for a stricter server that accepts unauthenticated mail only.
    acceptAnyAuth: true

  # Mailpit prunes itself, which is the main operational difference from
  # MailHog. Pruning is asynchronous — a background sweep, measured at roughly
  # 45s — so the count overshoots briefly after a burst.
  retention:
    # Keep at most this many messages (MP_MAX_MESSAGES). 0 disables the cap and
    # lets the database grow until the volume or the memory limit stops it.
    maxMessages: 500
    # Also drop messages older than this (MP_MAX_AGE), e.g. "24h" or "7d".
    # Empty → age-based pruning off, count cap only.
    maxAge: ""

  ui:
    # Web UI / API ingress. Off by default, and deliberately so: a mail catcher
    # holds every password-reset link and signup token the app has ever sent,
    # and Mailpit serves them unauthenticated unless `ui.auth` below is set.
    ingress:
      enabled: false
      ingressClassName: "traefik"
      # REQUIRED when enabled — rendering fails closed if left empty.
      hostname: ""
      path: /
      pathType: Prefix
      # Deployment-metadata standard: `app.togglecorp.com/component: resources`
      # comes from `commonLabels` below, like the MinIO ingress. Add your own
      # entries here for Traefik middlewares or cert-manager — they deep-merge
      # with the chart-fixed health-check below.
      annotations:
        # Endpoint for external uptime monitoring (NOT a k8s probe path, though
        # here they happen to agree). Chart-fixed, like MinIO's: the path is a
        # property of Mailpit, not of the install.
        #
        # /livez is exempt from MP_UI_AUTH_FILE, so a monitor gets a real 200
        # even with the UI locked down — no credentials to distribute.
        app.togglecorp.com/health-check: /livez
      # Passed through verbatim to `spec.tls`, e.g.
      #   - hosts: ["mail.example.com"]
      #     secretName: mail-example-com-tls
      tls: []

    # HTTP basic auth for the UI and API (Mailpit's `MP_UI_AUTH_FILE`). Empty →
    # no auth at all. Provide exactly one of the two:
    #
    #   htpasswd            — inline `user:bcrypt-hash` lines, rendered into a
    #                         chart-managed Secret `<fullname>-ui-auth`.
    #   existingSecret      — reference an externally-managed Secret (SealedSecrets,
    #                         External Secrets, Vault) holding the same file.
    #
    # The bcrypt hash is supplied, not generated: sprig's `htpasswd` salts
    # randomly, so a chart-computed hash changes on every render and leaves an
    # ArgoCD app permanently OutOfSync. Mint one with:
    #   htpasswd -nbB admin '<password>'
    #
    # /livez and /readyz stay open regardless, so the probes and any uptime
    # monitor are unaffected.
    auth:
      htpasswd: ""
      existingSecret:
        name: ""
        key: ""             # NO default — must match the key in your Secret

  # Message storage. Disabled → Mailpit keeps its SQLite database in the
  # container filesystem, so the inbox is lost on every restart, which is
  # usually what an alpha environment wants. Enabled → the database lives on
  # the PVC below (MP_DATABASE) and survives restarts and rollouts.
  #
  # Unlike a MailHog maildir this is safe to leave on: `retention` above bounds
  # the database, and Mailpit pages queries rather than loading the whole store
  # to render a list.
  persistence:
    enabled: false
    storageClass: "local-path"
    size: 1Gi  # NOTE: ignored by local-path (node disk is the real limit)
    accessModes:
      - ReadWriteOnce

  # Sized for the default 500-message cap. Peak memory tracks message size and
  # concurrency rather than the total inbox, so this does not need to grow with
  # a long-lived instance — but a burst of very large attachments does push it,
  # so raise the limit if `retention.maxMessages` goes up a lot.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # The image declares no USER, so it would otherwise run as root. Mailpit needs
  # no privileges: it binds 1025/8025 (both above 1024) and writes only to its
  # database directory.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # Satisfies the restricted Pod Security Standard. `readOnlyRootFilesystem` is
  # safe both ways: without persistence Mailpit keeps the database in memory,
  # and with it the only writes go to the mounted PVC.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Deployment-metadata standard (app.togglecorp.com/*): the deploy layer stamps
  # part-of/name/stack/tier/instance here; `component: resources` is OURS because
  # only this chart knows these resources serve a dependency, not the app.
  # Applied to every mailpit resource. Selector-safe — the Deployment's
  # matchLabels reads only app.kubernetes.io/{name,instance}.
  commonLabels:
    app.togglecorp.com/component: resources

  # Steer alpha mail catchers off RAID nodes — RAID is reserved for prod.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

  tolerations: []

  nodeSelector: {}

  # Annotations applied to every mailpit resource's metadata. On the ingress
  # they are merged with `ui.ingress.annotations`, which wins on a conflict.
  commonAnnotations: {}

# Shared config for the credential-bootstrap Helm-hook Jobs. A pre-install /
# pre-upgrade Job runs `kubectl` against the live cluster to create/manage the
# tcpg-pg-credential and minio-s3-credential Secrets (one GitOps-safe mechanism
# for plain Helm, Flux-HelmRelease, and ArgoCD — no `lookup`, no
# ignoreDifferences). The chart auto-creates the RBAC (ServiceAccount + Role +
# RoleBinding) the Jobs need.
secretBootstrap:
  image:
    # alpine/k8s ships a shell (/bin/sh) + kubectl — the Job's container runs a
    # shell script, so the old distroless registry.k8s.io/kubectl image (no
    # /bin/sh) could not execute it.
    repository: alpine/k8s
    tag: "1.31.1"   # pinned — verify a real existing tag before bumping
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  backoffLimit: 3
  activeDeadlineSeconds: 120
