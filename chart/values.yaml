tcpg:
  enabled: false

  # Stable name → predictable Service DNS: `tcpg.<namespace>.svc.cluster.local`.
  # Fixed name → resources are `tcpg-*` instead of `<release>-tcpg-*`.
  fullnameOverride: "tcpg"

  # Override the name of the Postgres credential Secret. Empty → computed default
  # `<fullname>-pg-credential` (i.e. `tcpg-pg-credential` with the override above).
  # The bootstrap Job (below) creates/manages a Secret by this name; the app and
  # StatefulSet consume it by the same name.
  secretName: ""

  image:
    repository: postgres
    tag: "18.1"
    pullPolicy: IfNotPresent
    pullSecrets: []

  initImage:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent

  # Memory request == limit (1Gi) keeps Postgres in the Guaranteed QoS class.
  # CPU burstable from 0.1 → 2 cores for dump restore / ad-hoc queries.
  resources:
    requests:
      cpu: 0.1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 1Gi

  # First-init only. These values seed the database the FIRST time it is
  # initialized: the credentials below seed the DB, and the dump/restore config
  # runs only at first init. After that, the live DB state in the PVC is what
  # matters — re-rendering this block does not re-seed an existing database.
  init:
    database: postgres
    username: postgres
    # Seeds the password ONLY at first init. A pre-install/pre-upgrade Helm-hook
    # Job (templates/tcpg/secret-bootstrap-job.yaml) bootstraps the
    # tcpg-pg-credential Secret against the LIVE cluster — GitOps-safe, no
    # `lookup`. Three-state logic at runtime:
    #   - set here       → write/overwrite the Secret with this password
    #   - empty + exists → preserve the existing Secret (no-op)
    #   - empty + absent → generate a random 32-char password once
    # The password is frozen into the PVC at first init and never re-read, so set
    # this explicitly only at first init or for a deliberate reset (must match the
    # PVC). The same value works identically under plain Helm and ArgoCD/Flux.
    password: ""
    # Optional one-shot restore on first init. The whole block is gated by
    # `restore.enabled` — when false, nothing restore-related renders (no init
    # container, no configmap, no restore-credential secret), regardless of the
    # other fields below.
    #
    # Effective URL is restore.baseUrl + restore.path, concatenated verbatim at
    # runtime. Both are non-secret (plain env vars, visible in the pod spec).
    # Authentication is handled separately via restore.auth below — do NOT embed
    # credentials in the URL.
    #
    # Supports plain .sql, .sql.gz, `pg_dump -Fc`.
    restore:
      enabled: false          # SOLE gate; whole block ignored when false
      baseUrl: ""             # e.g. https://example.com
      path: ""                # e.g. /dumps/prod/db.sql.gz
      # Skip TLS certificate verification for the download (curl -k). Use only
      # when the server presents a self-signed or internal-CA cert. Verify the
      # host out-of-band; this disables MITM protection for the download.
      insecureSkipTlsVerify: false
      # Auth for the download.
      #   type: none   — no auth header
      #   type: basic  — value is "user:pass", passed via curl -u
      #   type: bearer — value is the token, sent as Authorization: Bearer <value>
      # Only auth.value is secret. Either set it inline (stored in the chart-
      # managed Secret) OR reference an externally-managed Secret via
      # auth.existingSecret.{name,key}. The two are mutually exclusive — provide
      # exactly one when type != none.
      auth:
        type: none            # none | basic | bearer
        value: ""             # inline auth value ─┐ exactly one when type != none
        existingSecret:        # external secret ref ┘
          name: ""
          key: ""             # NO default — user must set it

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    # local-path uses the node's local disk via Rancher's local-path-provisioner.
    storageClass: "local-path"
    size: 1Gi  # NOTE: ignored by local-path (node disk is the real limit)
    accessModes:
      - ReadWriteOnce

  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # Applied to every container (init + main). Defaults satisfy the restricted
  # Pod Security Standard (PSS). The chart mounts emptyDirs at /tmp and (for
  # the main container) /var/run/postgresql so readOnlyRootFilesystem: true is
  # safe — Postgres writes only under $PGDATA, the unix-socket dir, and /tmp.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Single-replica DB → PDB blocks voluntary node drains. Off by default; enable
  # only if you'd rather have a stuck drain than an automated DB restart.
  podDisruptionBudget:
    enabled: false

  # Steer alpha databases off RAID nodes — RAID is reserved for prod. Alpha
  # workloads are disposable, so we leave the RAID pool for production-grade
  # services.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

  tolerations: []

  nodeSelector: {}

  # Annotations applied to every tcpg resource's metadata. Useful for Argo CD
  # sync-waves (argocd.argoproj.io/sync-wave) or Helm hooks (helm.sh/hook).
  # Does NOT propagate to the dragonfly/minio subcharts — use their own
  # annotation values if those charts support them.
  commonAnnotations: {}

# Dragonfly (Redis-compatible in-memory store). Pulled from the official OCI
# chart at ghcr.io/dragonflydb/dragonfly/helm (version pinned in Chart.yaml).
# Values are passed through to the subchart — see the upstream values for the
# full surface: https://github.com/dragonflydb/dragonfly/blob/main/contrib/charts/dragonfly/values.yaml
dragonfly:
  enabled: false
  # Stable name → Service DNS: `dragonfly.<namespace>.svc.cluster.local:6379`.
  fullnameOverride: "dragonfly"
  # Single-replica for alpha (no HA, no snapshot replication). Dragonfly has no
  # separate replicationFactor — `replicaCount: 1` is the only knob needed.
  replicaCount: 1
  resources:
    requests:
      cpu: 0.1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 1Gi
  storage:
    enabled: true
    storageClassName: "local-path"
    requests: 128Mi  # NOTE: ignored by local-path (node disk is the real limit)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

# MinIO (S3-compatible object store). Pulled from the Bitnami OCI chart at
# registry-1.docker.io/bitnamicharts/minio (version pinned in Chart.yaml).
# Values pass through to the subchart — see the upstream values for the full
# surface: https://github.com/bitnami/charts/blob/main/bitnami/minio/values.yaml
#
# NOTE: Bitnami restructured image distribution in Aug 2025 — the public
# `bitnami/*` repos went subscription-gated (Bitnami Secure Images). The chart
# still pins those repos as defaults, so a vanilla install will 401 on pull.
#
# We override every image the chart can pull to `bitnamilegacy/*` — a frozen
# free mirror of the pre-cutover images. Tags are inherited from the chart's
# own pinned defaults (the same tags exist on bitnamilegacy, so versions stay
# in lockstep with whatever Chart.yaml's `version:` was published with).
#
# Trade-off: `bitnamilegacy/*` is frozen — no future security patches. Fine
# for alpha. For production, set `image.repository: bitnami/<name>` (and the
# other three) back to bitnami and supply pull secrets for a Bitnami Secure
# Images subscription, or migrate off the Bitnami chart entirely.
#
# MinIO standalone for alpha. The topology below (standalone mode, WebUI off,
# Traefik ingress, single-node persistence) is baked in; a per-install overlay
# only supplies `minio.ingress.hostname` (the real S3 API host) and
# `minio.defaultBuckets`.
minio:
  enabled: false
  # Stable name → API DNS: `minio.<namespace>.svc.cluster.local:9000`.
  fullnameOverride: "minio"
  # Deployment-metadata standard (app.togglecorp.com/*): the deploy layer (argo-templates'
  # banjo-x) stamps part-of/name/stack/tier/instance here; `component: resources` is OURS
  # because only this chart knows these ingresses serve a dependency, not the app. Helm
  # deep-merges the two maps.
  #
  # Why commonLabels and not ingress.labels: the bitnami minio subchart exposes no
  # per-ingress labels value, so this is the only hook. It lands on ALL minio resources,
  # which is selector-SAFE: bitnami's `common.labels.matchLabels` picks only
  # app.kubernetes.io/{name,instance} out of customLabels, so arbitrary labels never
  # reach an immutable matchLabels selector.
  commonLabels:
    app.togglecorp.com/component: resources
  auth:
    # The parent chart generates this secret (see templates/minio/secret.yaml) and
    # MinIO reads its root creds back from it. Single source of truth: the secret
    # is NAMED after this value. App consumes the same secret via envFrom.
    existingSecret: minio-s3-credential
    rootUserSecretKey: S3_ACCESS_KEY_ID
    rootPasswordSecretKey: S3_SECRET_ACCESS_KEY
  image:
    repository: bitnamilegacy/minio
  clientImage:
    repository: bitnamilegacy/minio-client
  console:
    enabled: false
    image:
      repository: bitnamilegacy/minio-object-browser
  defaultInitContainers:
    volumePermissions:
      # Off by default upstream; pinned here so flipping `enabled: true` in an
      # overlay doesn't silently fall back to the gated bitnami/os-shell repo.
      image:
        repository: bitnamilegacy/os-shell
  disableWebUI: true
  mode: standalone
  ingress:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      # Per-request body cap (NOT a per-object limit), enforced by the Traefik
      # Middleware `minio-body-limit` (rendered by the parent chart from
      # minioConfig.maxRequestBodyBytes). Requires a Traefik ingress. The
      # `{{ .Release.Namespace }}` token below is left LITERAL on purpose — the
      # MinIO subchart resolves it via tpl at render time.
      traefik.ingress.kubernetes.io/router.middlewares: '{{ .Release.Namespace }}-minio-body-limit@kubernetescrd'
      # Deep health endpoint for external uptime monitoring (NOT a k8s probe path).
      # Chart-fixed: MinIO's liveness path is a property of MinIO, not of the install,
      # so no overlay should have to know it.
      app.togglecorp.com/health-check: /minio/health/live
  # Your per-install overlay MUST set `minio.ingress.hostname` to the real S3 API
  # host. The parent chart derives S3_ENDPOINT_URL from it (see
  # templates/minio/secret.yaml); rendering fails closed if it's left empty (or
  # set minioConfig.endpointUrl explicitly).
  defaultBuckets: ""
  provisioning:
    enabled: true
    resourcesPreset: "nano"
    cleanupAfterFinished:
      enabled: true
  resources:
    requests:
      cpu: 0.1
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1Gi
  global:
    defaultStorageClass: "local-path"
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 1Gi  # NOTE: ignored by local-path (node disk is the real limit)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: "node.kubernetes.io/disk-raid"
            operator: NotIn
            values:
              - "true"

# Parent-chart-managed MinIO/S3 credentials. The chart renders a single Secret
# (templates/minio/secret.yaml, named after minio.auth.existingSecret) exposing
# S3_ENDPOINT_URL / S3_REGION / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY. The app
# binds it via envFrom; MinIO reads the access key / secret key back as its root
# user / password. One secret, no drift.
minioConfig:
  # Fixed access key id (like a username — not secret, not random). Becomes
  # S3_ACCESS_KEY_ID and MinIO's root user.
  accessKeyId: minio
  # Bootstrapped by the pre-install/pre-upgrade Helm-hook Job
  # (templates/minio/secret-bootstrap-job.yaml) against the LIVE cluster —
  # GitOps-safe, no `lookup`. Three-state logic at runtime:
  #   - set here       → write/overwrite the Secret with this key (rotation)
  #   - empty + exists → preserve the existing Secret (no-op)
  #   - empty + absent → generate a random 32-char key once
  # MinIO re-reads this on restart, so it is rotatable: set the value and restart
  # MinIO + consuming app pods. The same value works under plain Helm and GitOps.
  secretAccessKey: ""
  region: us-east-1
  endpointScheme: https
  # Explicit S3_ENDPOINT_URL override. Empty → derived as
  # "<endpointScheme>://<minio.ingress.hostname>". Set this for in-cluster svc
  # endpoints or non-ingress setups.
  endpointUrl: ""
  # Per-request body size cap (integer bytes) for the MinIO S3 ingress. Empty →
  # no Traefik Middleware is rendered. This is a PER-REQUEST cap, not a
  # per-object limit. Requires a Traefik ingress (the Middleware is a Traefik
  # CRD; wire it via the router.middlewares annotation on minio.ingress).
  maxRequestBodyBytes: 104857600  # 100 MiB — per-request cap
  # Bytes held in memory per in-flight request before spilling to disk (integer
  # bytes). Empty → omitted from the Middleware spec, so Traefik's 1 MiB default
  # applies. Only takes effect when maxRequestBodyBytes is set.
  memRequestBodyBytes: 52428800   # 50 MiB — held in memory before spilling to disk

# Shared config for the credential-bootstrap Helm-hook Jobs. A pre-install /
# pre-upgrade Job runs `kubectl` against the live cluster to create/manage the
# tcpg-pg-credential and minio-s3-credential Secrets (one GitOps-safe mechanism
# for plain Helm, Flux-HelmRelease, and ArgoCD — no `lookup`, no
# ignoreDifferences). The chart auto-creates the RBAC (ServiceAccount + Role +
# RoleBinding) the Jobs need.
secretBootstrap:
  image:
    # alpine/k8s ships a shell (/bin/sh) + kubectl — the Job's container runs a
    # shell script, so the old distroless registry.k8s.io/kubectl image (no
    # /bin/sh) could not execute it.
    repository: alpine/k8s
    tag: "1.31.1"   # pinned — verify a real existing tag before bumping
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  backoffLimit: 3
  activeDeadlineSeconds: 120
