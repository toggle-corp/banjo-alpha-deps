repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: check-yaml
        # Helm templates contain Go templating, not valid YAML.
        exclude: ^chart/templates/

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: helm lint .
        language: system
        pass_filenames: false
        files: ^(Chart\.yaml|values\.yaml|templates/|tests/)

      - id: helm-unittest
        name: helm unittest
        entry: helm unittest .
        language: system
        pass_filenames: false
        files: ^(Chart\.yaml|values\.yaml|templates/|tests/)

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
