name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  # `helm push` appends the chart name, so the chart lands at
  # ghcr.io/toggle-corp/banjo-alpha-deps:<version>.
  OCI_REGISTRY: oci://ghcr.io/toggle-corp

jobs:
  release:
    name: Publish chart and GitHub Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # Tags are v-prefixed; the chart version is the bare SemVer.
          version_tag="${GITHUB_REF_NAME}"
          chart_version="${version_tag#v}"

          # A SemVer pre-release (1.2.0-rc.1) has a hyphen after the core version.
          is_prerelease=false
          if [[ "$chart_version" == *-* ]]; then
            is_prerelease=true
          fi

          {
            echo "version_tag=${version_tag}"
            echo "chart_version=${chart_version}"
            echo "is_prerelease=${is_prerelease}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Releasing ${version_tag} (chart ${chart_version}, prerelease=${is_prerelease})"

      - name: Verify Chart.yaml matches the tag
        shell: bash
        run: |
          # release.sh's hook bumps this before tagging. If they disagree, the tag
          # was cut by hand and the published chart would carry the wrong version.
          declared="$(awk '/^version:/ {print $2; exit}' chart/Chart.yaml)"
          expected="${{ steps.version.outputs.chart_version }}"
          if [[ "$declared" != "$expected" ]]; then
            echo "::error::chart/Chart.yaml declares version '$declared' but the tag implies '$expected'." \
                 "Cut releases with ./release.sh so the hook keeps them in sync."
            exit 1
          fi
          echo "chart/Chart.yaml version: $declared"

      # release.sh generates CHANGELOG.md and commits it in the tagged commit, so
      # the release notes are its topmost section. Re-rendering here with
      # `git-cliff --latest` instead would diverge: --latest resolves the previous
      # release to the adjacent dev tag, so a stable release cut right after a dev
      # tag renders an empty body.
      - name: Extract the release notes
        shell: bash
        run: |
          awk '/^## /{ section++ } section == 1' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No release notes found in CHANGELOG.md"
            exit 1
          fi

          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        id: package
        shell: bash
        run: |
          # Subchart tarballs are gitignored; pull them from Chart.lock.
          helm dep build chart
          helm package chart --destination dist
          echo "path=dist/banjo-alpha-deps-${{ steps.version.outputs.chart_version }}.tgz" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            helm registry login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Push chart to GHCR
        run: helm push '${{ steps.package.outputs.path }}' '${{ env.OCI_REGISTRY }}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.version.outputs.version_tag }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          body_path: RELEASE_NOTES.md
          # Offline fallback for clusters whose ArgoCD repo-server can't reach GHCR.
          files: ${{ steps.package.outputs.path }}
